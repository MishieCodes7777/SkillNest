<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillNest - Welcome</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .split-container {
            display: flex;
            height: 100vh;
        }

        /* LEFT SIDE - Form */
        .left-side {
            flex: 1;
            background: #0a0a14;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 50px;
        }

        .form-wrapper {
            width: 100%;
            max-width: 380px;
        }

        .brand {
            font-size: 26px;
            color: #ff4fa3;
            font-weight: bold;
            margin-bottom: 35px;
            letter-spacing: 0.5px;
        }

        .form-wrapper h1 {
            font-size: 28px;
            color: white;
            margin-bottom: 8px;
        }

        .form-wrapper .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Google button */
        .google-btn {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            background: transparent;
            color: white;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
            margin-bottom: 20px;
        }

        .google-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .google-btn img {
            width: 20px;
            height: 20px;
        }

        .divider {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            color: #555;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            padding: 0 15px;
        }

        /* Role toggle */
        .role-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: #1c1c2e;
            border-radius: 8px;
            padding: 5px;
        }

        .role-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #888;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .role-btn.active {
            background: linear-gradient(45deg, #ec4899, #8b5cf6);
            color: white;
        }

        /* Inputs */
        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            color: #aaa;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: #1c1c2e;
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .input-group input:focus {
            border-color: #8b5cf6;
        }

        /* Forgot link */
        .forgot-row {
            text-align: right;
            margin-bottom: 20px;
        }

        .forgot-row a {
            color: #8b5cf6;
            text-decoration: none;
            font-size: 13px;
        }

        .forgot-row a:hover {
            text-decoration: underline;
        }

        /* Submit button */
        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #ec4899, #8b5cf6);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.4);
        }

        .bottom-text {
            text-align: center;
            color: #888;
            font-size: 14px;
        }

        .bottom-text a {
            color: #8b5cf6;
            text-decoration: none;
            font-weight: 600;
        }

        .bottom-text a:hover {
            text-decoration: underline;
        }

        /* RIGHT SIDE - Three.js */
        .right-side {
            flex: 1;
            position: relative;
            background: #0a0a14;
            overflow: hidden;
        }

        #three-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .right-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
            pointer-events: none;
        }

        .right-overlay h1 {
            font-size: 56px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff4fa3, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .right-overlay p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 15px;
            text-align: center;
            max-width: 280px;
            line-height: 1.5;
            margin-top: 12px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .split-container {
                flex-direction: column;
            }

            .right-side {
                display: none;
            }

            .left-side {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="split-container">
        <!-- LEFT: Login Form -->
        <div class="left-side">
            <div class="form-wrapper">
                <div class="brand">Learn. Teach. Grow.</div>

                <!-- Role Toggle -->
                <div class="role-toggle">
                    <button class="role-btn active" id="learnBtn" onclick="setRole('user')">Learn Skills</button>
                    <button class="role-btn" id="teachBtn" onclick="setRole('contributor')">Teach Skills</button>
                </div>

                <!-- Email -->
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter your email">
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                </div>

                <!-- Forgot password -->
                <div class="forgot-row">
                    <a href="forgot-password.html?role=user" id="forgotLink">Forgot password?</a>
                </div>

                <!-- Login Button -->
                <button class="submit-btn" onclick="login()">Log In</button>

                <div class="divider"><span>or</span></div>

                <!-- Google Login -->
                <button class="google-btn" onclick="googleLogin()">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                    Continue with Google
                </button>

                <!-- Signup link -->
                <p class="bottom-text">
                    Don't have an account? <a href="user-signup.html" id="signupLink">Sign up for free</a>
                </p>
            </div>
        </div>

        <!-- RIGHT: Three.js 3D + Branding -->
        <div class="right-side">
            <canvas id="three-canvas"></canvas>
            <div class="right-overlay">
                <h1>SkillNest</h1>
                <p>Learn skills together with real mentors, in real-time, for free.</p>
            </div>
        </div>
    </div>

    <!-- THREE.JS -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const canvas = document.getElementById('three-canvas');
        const parent = canvas.parentElement;
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, parent.clientWidth / parent.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });

        renderer.setSize(parent.clientWidth, parent.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Particles — same style as home.html
        const particleCount = 1500;
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 20;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 20;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 20;

            const t = Math.random();
            colors[i * 3] = 0.9 + t * 0.1;
            colors[i * 3 + 1] = 0.2 + t * 0.3;
            colors[i * 3 + 2] = 0.5 + t * 0.5;
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.03,
            vertexColors: true,
            transparent: true,
            opacity: 0.7,
            blending: THREE.AdditiveBlending,
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // Floating wireframe shapes
        const shapes = [];
        const shapeMaterial = new THREE.MeshBasicMaterial({
            color: 0x8b5cf6,
            wireframe: true,
            transparent: true,
            opacity: 0.15,
        });

        for (let i = 0; i < 5; i++) {
            const geos = [
                new THREE.IcosahedronGeometry(0.5, 0),
                new THREE.OctahedronGeometry(0.4, 0),
                new THREE.TetrahedronGeometry(0.4, 0),
            ];
            const geo = geos[Math.floor(Math.random() * geos.length)];
            const mesh = new THREE.Mesh(geo, shapeMaterial.clone());

            mesh.position.set(
                (Math.random() - 0.5) * 12,
                (Math.random() - 0.5) * 8,
                (Math.random() - 0.5) * 6 - 3
            );

            mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
            mesh.userData = {
                rotSpeed: { x: 0.002 + Math.random() * 0.005, y: 0.002 + Math.random() * 0.005 },
                floatSpeed: 0.3 + Math.random() * 0.5,
                floatOffset: Math.random() * Math.PI * 2,
            };

            scene.add(mesh);
            shapes.push(mesh);
        }

        camera.position.z = 5;

        // Mouse interaction
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;

            particles.rotation.y += 0.0003;
            particles.rotation.x += 0.0001;
            particles.rotation.y += mouseX * 0.0005;
            particles.rotation.x += mouseY * 0.0003;

            shapes.forEach(shape => {
                shape.rotation.x += shape.userData.rotSpeed.x;
                shape.rotation.y += shape.userData.rotSpeed.y;
                shape.position.y += Math.sin(time * shape.userData.floatSpeed + shape.userData.floatOffset) * 0.003;
            });

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            const parent = canvas.parentElement;
            const width = parent.clientWidth;
            const height = parent.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });

        // Also observe the right-side container for resize
        const resizeObserver = new ResizeObserver(() => {
            const parent = canvas.parentElement;
            const width = parent.clientWidth;
            const height = parent.clientHeight;
            if (width > 0 && height > 0) {
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
                renderer.setSize(width, height);
            }
        });
        resizeObserver.observe(canvas.parentElement);
    </script>

    <!-- App Logic -->
    <script>
        let currentRole = 'learner';

        function setRole(role) {
            currentRole = role === 'user' ? 'learner' : 'mentor';
            document.getElementById('learnBtn').classList.toggle('active', role === 'user');
            document.getElementById('teachBtn').classList.toggle('active', role === 'contributor');
            document.getElementById('forgotLink').href = 'forgot-password.html?role=' + role;
            document.getElementById('signupLink').href = role === 'user' ? 'user-signup.html' : 'contributor-signup.html';
        }

        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                showError('Please enter both email and password.');
                return;
            }

            if (!email.includes('@') || !email.includes('.')) {
                showError('Please enter a valid email address.');
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters.');
                return;
            }

            // Disable button while loading
            const btn = document.querySelector('.submit-btn');
            btn.textContent = 'Logging in...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });

                const data = await res.json();

                if (data.success) {
                    // Store token and user info
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    window.location.href = 'dashboard.html?user=' + data.user.name;
                } else {
                    showError(data.message || 'Invalid email or password.');
                }
            } catch (err) {
                showError('Unable to connect to server. Make sure the server is running.');
            }

            btn.textContent = 'Log In';
            btn.disabled = false;
        }

        function googleLogin() {
            alert('Google Sign-In will be integrated with Firebase Auth in production.');
        }

        function showError(msg) {
            // Remove existing error
            let existing = document.querySelector('.error-msg');
            if (existing) existing.remove();

            const div = document.createElement('div');
            div.className = 'error-msg';
            div.style.cssText = 'color:#ff4d4d; font-size:13px; text-align:center; margin-bottom:10px; padding:8px; background:rgba(255,77,77,0.1); border-radius:6px;';
            div.textContent = msg;

            const btn = document.querySelector('.submit-btn');
            btn.parentNode.insertBefore(div, btn);

            setTimeout(() => div.remove(), 4000);
        }

        // Enter key
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') login();
        });

        // If user is switching accounts, clear old session
        (function () {
            // Don't auto-redirect — let user login fresh
            // They might be switching accounts
        })();
    </script>
</body>

</html>
