<!DOCTYPE html>
<html>

<head>
    <title>SkillNest - Get Started</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #0f0f1a, #1a1a2e);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Center box */
        .container {
            text-align: center;
        }

        /* Heading */
        h1 {
            margin-bottom: 40px;
        }

        /* Buttons */
        button {
            display: block;
            width: 220px;
            margin: 15px auto;
            padding: 12px;
            background: linear-gradient(45deg, #ec4899, #8b5cf6);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome to SkillNest</h1>

        <button onclick="goUser()">Learn Skills</button>
        <button onclick="goContributor()">Teach Skills</button>
    </div>

    <script>
        function goUser() {
            window.location.href = "user-login.html";
        }

        function goContributor() {
            window.location.href = "contributor-login.html";
        }
    </script>

</body>

</html>
