<!DOCTYPE html>
<html>

<head>
    <title>contributor Login</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #0f0f1a, #1a1a2e);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 35px;
            border-radius: 12px;
            width: 320px;

            /* 👇 THIS IS THE GLOW */
            box-shadow:
                0 0 20px rgba(236, 72, 153, 0.4),
                0 0 40px rgba(168, 85, 247, 0.3);
        }

        /* Heading */
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        /* Inputs */
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 6px;
            outline: none;
            background: #0f0f1a;
            color: white;
        }

        /* Button */
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: linear-gradient(45deg, #6c63ff, #8a7dff);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }

        /* Links */
        a {
            color: #8a7dff;
            text-decoration: none;
        }

        p {
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Contributor Login</h2>

        <input id="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">

        <button onclick="login()">Login</button>

        <p>No account? <a href="contributor-signup.html">Signup</a></p>
    </div>
    <script>
        function login() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const users = JSON.parse(localStorage.getItem("users")) || [];

            const user = users.find(u =>
                u.email === email &&
                u.password === password &&
                u.role === "contributor"
            );

            if (user) {
                localStorage.setItem("currentUser", JSON.stringify(user));
                window.location.href = "dashboard.html"; // ✅ fixed
            } else {
                alert("Invalid credentials");
            }
        }
    </script>

</body>

</html>
