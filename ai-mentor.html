<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mentor - SkillNest</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0a0a14;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top bar */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #1c1c2e;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .topbar-logo {
            color: #ff4fa3;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        .topbar-nav {
            display: flex;
            gap: 15px;
        }

        .topbar-nav button {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ccc;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .topbar-nav button:hover {
            border-color: #8b5cf6;
            color: white;
        }

        .topbar-nav button.active {
            background: linear-gradient(45deg, #ec4899, #8b5cf6);
            border: none;
            color: white;
        }

        /* Chat container */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
        }

        .chat-header {
            text-align: center;
            padding: 30px 20px;
        }

        .chat-header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #ff4fa3, #6c63ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chat-header p {
            color: #888;
            font-size: 14px;
        }

        /* Quick prompts */
        .quick-prompts {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .quick-prompt {
            background: #1c1c2e;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            border-radius: 20px;
            color: #ccc;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        .quick-prompt:hover {
            border-color: #ec4899;
            color: white;
        }

        /* Messages */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(45deg, #ec4899, #8b5cf6);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: #1c1c2e;
            color: #e0e0e0;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .message.ai code {
            background: #0f0f1a;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
            color: #ff4fa3;
        }

        .message.ai pre {
            background: #0f0f1a;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            overflow-x: auto;
            font-size: 13px;
            color: #ccc;
        }

        .typing-indicator {
            align-self: flex-start;
            padding: 14px 18px;
            background: #1c1c2e;
            border-radius: 12px;
            color: #888;
            font-style: italic;
        }

        .typing-indicator::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {

            0%,
            20% {
                content: '.';
            }

            40% {
                content: '..';
            }

            60%,
            100% {
                content: '...';
            }
        }

        /* Input */
        .chat-input {
            display: flex;
            gap: 10px;
            padding: 15px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chat-input input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #1c1c2e;
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .chat-input input:focus {
            border-color: #8b5cf6;
        }

        .chat-input button {
            padding: 14px 20px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(45deg, #ec4899, #8b5cf6);
            color: white;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }

        .chat-input button:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(236, 72, 153, 0.3);
        }
    </style>
</head>

<body>
    <!-- Top bar -->
    <div class="topbar">
        <div class="topbar-logo" onclick="goHome()">SkillNest</div>
        <div class="topbar-nav">
            <button class="active">AI Mentor</button>
            <button onclick="window.location.href='ai-roadmap.html'">AI Roadmap</button>
            <button onclick="goHome()">Home</button>
        </div>
    </div>

    <!-- Chat -->
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 AI Mentor</h1>
            <p>Ask anything — CS concepts, coding help, career advice, or skill guidance</p>
        </div>

        <div class="quick-prompts">
            <div class="quick-prompt" onclick="askQuick('Explain BFS in simple terms')">Explain BFS</div>
            <div class="quick-prompt" onclick="askQuick('What is the difference between REST and GraphQL?')">REST vs
                GraphQL</div>
            <div class="quick-prompt" onclick="askQuick('How do I center a div in CSS?')">Center a div</div>
            <div class="quick-prompt" onclick="askQuick('Explain async/await in JavaScript')">Async/Await</div>
            <div class="quick-prompt" onclick="askQuick('What is Big O notation?')">Big O Notation</div>
            <div class="quick-prompt" onclick="askQuick('Explain how React hooks work')">React Hooks</div>
        </div>

        <div class="messages" id="messages"></div>

        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Ask your AI mentor anything..."
                onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">
                <span class="material-icons" style="font-size:20px;">send</span>
                Send
            </button>
        </div>
    </div>

    <script>
        // AI Knowledge Base
        const knowledgeBase = {
            "bfs": `**Breadth-First Search (BFS)** is a graph traversal algorithm that explores all neighbors at the current depth before moving to the next level.

**How it works:**
1. Start from a source node
2. Visit all its direct neighbors first
3. Then visit neighbors of neighbors
4. Uses a **Queue** (FIFO) data structure

**Example:**
<pre>
function bfs(graph, start) {
    let queue = [start];
    let visited = new Set([start]);
    
    while (queue.length > 0) {
        let node = queue.shift();
        console.log(node);
        
        for (let neighbor of graph[node]) {
            if (!visited.has(neighbor)) {
                visited.add(neighbor);
                queue.push(neighbor);
            }
        }
    }
}
</pre>

**Time Complexity:** O(V + E) where V = vertices, E = edges
**Use cases:** Shortest path in unweighted graphs, level-order traversal, social network connections`,

            "dfs": `**Depth-First Search (DFS)** explores as deep as possible along each branch before backtracking.

**How it works:**
1. Start from a node
2. Go as deep as possible
3. Backtrack when stuck
4. Uses a **Stack** (or recursion)

<pre>
function dfs(graph, node, visited = new Set()) {
    visited.add(node);
    console.log(node);
    
    for (let neighbor of graph[node]) {
        if (!visited.has(neighbor)) {
            dfs(graph, neighbor, visited);
        }
    }
}
</pre>

**Time Complexity:** O(V + E)
**Use cases:** Detecting cycles, topological sort, maze solving`,

            "rest": `**REST vs GraphQL:**

| Feature | REST | GraphQL |
|---------|------|---------|
| Endpoints | Multiple (one per resource) | Single endpoint |
| Data fetching | Fixed response structure | Client specifies what it needs |
| Over-fetching | Common problem | Solved — get only what you ask |
| Versioning | URL-based (v1, v2) | No versioning needed |

**REST Example:**
\`GET /api/users/1\` → returns ALL user fields

**GraphQL Example:**
<pre>
query {
    user(id: 1) {
        name
        email
    }
}
</pre>
→ returns ONLY name and email

**When to use REST:** Simple CRUD, caching matters, small teams
**When to use GraphQL:** Complex data relationships, mobile apps, multiple clients`,

            "center div": `**How to center a div in CSS:**

**Method 1: Flexbox (recommended)**
<pre>
.parent {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
</pre>

**Method 2: Grid**
<pre>
.parent {
    display: grid;
    place-items: center;
    height: 100vh;
}
</pre>

**Method 3: Absolute + Transform**
<pre>
.child {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}
</pre>

Flexbox is the modern standard — use it!`,

            "async": `**Async/Await in JavaScript:**

It's syntactic sugar over Promises, making async code look synchronous.

<pre>
// With Promises:
fetch('/api/data')
    .then(res => res.json())
    .then(data => console.log(data))
    .catch(err => console.error(err));

// With Async/Await:
async function getData() {
    try {
        const res = await fetch('/api/data');
        const data = await res.json();
        console.log(data);
    } catch (err) {
        console.error(err);
    }
}
</pre>

**Key rules:**
• \`await\` only works inside \`async\` functions
• \`async\` functions always return a Promise
• Use \`try/catch\` for error handling
• You can \`await\` multiple promises with \`Promise.all()\``,

            "big o": `**Big O Notation** describes how an algorithm's time/space grows as input grows.

**Common complexities (best to worst):**
• **O(1)** — Constant: Array access by index
• **O(log n)** — Logarithmic: Binary search
• **O(n)** — Linear: Simple loop
• **O(n log n)** — Merge sort, quicksort (avg)
• **O(n²)** — Quadratic: Nested loops, bubble sort
• **O(2ⁿ)** — Exponential: Recursive fibonacci

**Example:**
<pre>
// O(1)
arr[0];

// O(n)
for (let i = 0; i < n; i++) { ... }

// O(n²)
for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) { ... }
}
</pre>

**Tip:** Drop constants and lower terms. O(2n + 5) = O(n)`,

            "react hooks": `**React Hooks** let you use state and lifecycle in function components.

**Most common hooks:**

**1. useState** — manage state
<pre>
const [count, setCount] = useState(0);
</pre>

**2. useEffect** — side effects (API calls, timers)
<pre>
useEffect(() => {
    fetch('/api/data')
        .then(res => res.json())
        .then(setData);
}, []); // [] = runs once on mount
</pre>

**3. useRef** — access DOM or persist values
<pre>
const inputRef = useRef(null);
inputRef.current.focus();
</pre>

**4. useContext** — share data without prop drilling

**Rules of Hooks:**
• Only call at the top level (not in loops/conditions)
• Only call in React functions`,

            "closure": `**Closures in JavaScript:**

A closure is when a function "remembers" variables from its outer scope even after the outer function has returned.

<pre>
function outer() {
    let count = 0;
    
    return function inner() {
        count++;
        return count;
    };
}

const counter = outer();
counter(); // 1
counter(); // 2
counter(); // 3
</pre>

The inner function "closes over" the \`count\` variable.

**Use cases:**
• Data privacy (module pattern)
• Factory functions
• Event handlers
• Callbacks with state`
        };

        function goHome() {
            const params = new URLSearchParams(window.location.search);
            const user = params.get("user");
            window.location.href = user ? "home.html?user=" + user : "home.html";
        }

        function askQuick(text) {
            document.getElementById("userInput").value = text;
            sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;

            // Add user message
            addMessage(text, "user");
            input.value = "";

            // Show typing
            showTyping();

            // Generate AI response (real API call)
            const response = await generateResponse(text);
            hideTyping();
            addMessage(response, "ai");
        }

        function addMessage(text, type) {
            const container = document.getElementById("messages");
            const div = document.createElement("div");
            div.className = "message " + type;

            if (type === "ai") {
                // Parse markdown-like formatting
                div.innerHTML = formatResponse(text);
            } else {
                div.textContent = text;
            }

            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function formatResponse(text) {
            // Bold
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            // Code inline
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            // Line breaks
            text = text.replace(/\n/g, '<br>');
            return text;
        }

        function showTyping() {
            const container = document.getElementById("messages");
            const div = document.createElement("div");
            div.className = "typing-indicator";
            div.id = "typing";
            div.textContent = "AI is thinking";
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function hideTyping() {
            const el = document.getElementById("typing");
            if (el) el.remove();
        }

        async function generateResponse(question) {
            // Call real AI API
            try {
                const res = await fetch('/api/ai/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: question })
                });
                const data = await res.json();
                if (data.success) return data.response;
                return "I'm having trouble connecting right now. Please try again in a moment.";
            } catch (err) {
                return "Unable to reach AI service. Make sure the server is running.";
            }
        }
    </script>
</body>

</html>

<style>
    .chat-container {
        padding-top: 60px !important;
    }
</style>
