<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Learning Roadmap - SkillNest</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0a0a14;
            color: white;
            min-height: 100vh;
        }

        /* Top bar */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #1c1c2e;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .topbar-logo {
            color: #ff4fa3;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        .topbar-nav {
            display: flex;
            gap: 15px;
        }

        .topbar-nav button {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ccc;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .topbar-nav button:hover {
            border-color: #8b5cf6;
            color: white;
        }

        .topbar-nav button.active {
            background: linear-gradient(45deg, #ec4899, #8b5cf6);
            border: none;
            color: white;
        }

        /* Main content */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff4fa3, #6c63ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-header p {
            color: #888;
            font-size: 15px;
        }

        /* Input section */
        .input-section {
            background: #1c1c2e;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-section h3 {
            margin-bottom: 20px;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #aaa;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #0f0f1a;
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #8b5cf6;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group select {
            appearance: none;
            cursor: pointer;
        }

        .generate-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, #ec4899, #8b5cf6);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.3);
        }

        /* Roadmap output */
        .roadmap-output {
            display: none;
        }

        .roadmap-output.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .roadmap-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .roadmap-title h2 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .roadmap-title p {
            color: #888;
            font-size: 14px;
        }

        /* Week cards */
        .week-card {
            background: #1c1c2e;
            padding: 22px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 4px solid #8b5cf6;
            transition: 0.3s;
            position: relative;
        }

        .week-card:hover {
            transform: translateX(5px);
            border-left-color: #ec4899;
        }

        .week-card .week-number {
            font-size: 12px;
            color: #ec4899;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .week-card h3 {
            font-size: 17px;
            margin-bottom: 8px;
        }

        .week-card p {
            color: #aaa;
            font-size: 14px;
            line-height: 1.5;
        }

        .week-card .topics {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .week-card .topic-tag {
            background: rgba(139, 92, 246, 0.15);
            color: #c4a5ff;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
        }

        .week-card .hours {
            position: absolute;
            top: 22px;
            right: 22px;
            color: #666;
            font-size: 12px;
        }

        /* Progress bar */
        .progress-section {
            background: #1c1c2e;
            padding: 20px;
            border-radius: 12px;
            margin-top: 25px;
            text-align: center;
        }

        .progress-section h4 {
            margin-bottom: 12px;
            color: #ccc;
        }

        .progress-bar {
            height: 8px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(45deg, #ec4899, #8b5cf6);
            border-radius: 10px;
            width: 0%;
            transition: width 1s ease;
        }

        .progress-text {
            margin-top: 8px;
            font-size: 13px;
            color: #888;
        }

        /* Daily tasks */
        .day-task {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .day-task:last-child {
            border-bottom: none;
        }

        .day-task label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #ccc;
            cursor: pointer;
            transition: 0.2s;
        }

        .day-task label:hover {
            color: white;
        }

        .day-task input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #A855F7;
            cursor: pointer;
            flex-shrink: 0;
        }

        .day-task input[type="checkbox"]:checked+.day-label {
            color: #A855F7;
        }

        .day-task input[type="checkbox"]:checked~* {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .day-label {
            font-weight: 600;
            color: #FF4FA3;
            min-width: 45px;
        }

        .expand-icon {
            transition: 0.2s;
        }

        .week-card:hover .expand-icon {
            color: #FF4FA3 !important;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #ec4899;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <!-- Top bar -->
    <div class="topbar">
        <div class="topbar-logo" onclick="goHome()">SkillNest</div>
        <div class="topbar-nav">
            <button onclick="window.location.href='ai-mentor.html'">AI Mentor</button>
            <button class="active">AI Roadmap</button>
            <button onclick="goHome()">Home</button>
        </div>
    </div>

    <div class="container">
        <div class="page-header">
            <h1>🗺️ AI Learning Roadmap</h1>
            <p>Tell us what you want to learn and we'll create a personalized week-by-week plan</p>
        </div>

        <!-- Input Form -->
        <div class="input-section" id="inputSection">
            <h3>What skills do you already have?</h3>

            <div class="form-group">
                <label>Your current skills (comma separated)</label>
                <input type="text" id="currentSkills" placeholder="e.g. HTML, CSS, basic JavaScript">
            </div>

            <div class="form-group">
                <label>What do you want to learn?</label>
                <input type="text" id="goalSkill" placeholder="e.g. Full Stack Development, Data Science, AI/ML">
            </div>

            <div class="form-group">
                <label>Hours per week you can dedicate</label>
                <select id="hoursPerWeek">
                    <option value="5">5 hours/week (casual)</option>
                    <option value="10" selected>10 hours/week (moderate)</option>
                    <option value="15">15 hours/week (dedicated)</option>
                    <option value="20">20+ hours/week (intensive)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Any specific goals? (optional)</label>
                <textarea id="specificGoals"
                    placeholder="e.g. Get a job as a React developer, build a SaaS product, crack FAANG interviews"></textarea>
            </div>

            <button class="generate-btn" onclick="generateRoadmap()">
                <span class="material-icons" style="font-size:20px;">auto_awesome</span>
                Generate My Roadmap
            </button>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>AI is crafting your personalized roadmap...</p>
        </div>

        <!-- Roadmap Output -->
        <div class="roadmap-output" id="roadmapOutput"></div>

        <!-- History Panel -->
        <div id="historyPanel" style="display:none; margin-top:30px;">
            <h3 style="font-size:16px; margin-bottom:15px; display:flex; align-items:center; gap:8px; color:#ccc;">
                <span class="material-icons" style="font-size:20px; color:#A855F7;">history</span> Previous Roadmaps
            </h3>
            <div id="historyList"></div>
        </div>
    </div>

    <script>
        function _uemail() { var s = localStorage.getItem('currentUser'); if (s) { try { return JSON.parse(s).email || 'default'; } catch (e) { } } return 'default'; }
        function goHome() {
            const params = new URLSearchParams(window.location.search);
            const user = params.get("user");
            window.location.href = user ? "home.html?user=" + user : "home.html";
        }

        function generateRoadmap() {
            const skills = document.getElementById("currentSkills").value.trim();
            const goal = document.getElementById("goalSkill").value.trim();
            const hours = document.getElementById("hoursPerWeek").value;
            const goals = document.getElementById("specificGoals").value.trim();

            if (!skills || !goal) {
                alert("Please enter your current skills and what you want to learn!");
                return;
            }

            // Show loading
            document.getElementById("inputSection").style.display = "none";
            document.getElementById("loading").classList.add("show");

            // Simulate AI processing
            setTimeout(() => {
                document.getElementById("loading").classList.remove("show");
                const roadmap = createRoadmap(skills, goal, hours, goals);

                // Save to history
                saveToHistory(skills, goal, hours, roadmap);

                displayRoadmap(roadmap, skills, goal);
                showHistory();
            }, 2000);
        }

        function saveToHistory(skills, goal, hours, roadmap) {
            const HISTORY_KEY = 'skillnest_roadmap_history_' + _uemail();
            let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            history.unshift({
                id: Date.now(),
                skills: skills,
                goal: goal,
                hours: hours,
                weeks: roadmap.length,
                date: new Date().toLocaleDateString(),
                roadmap: roadmap
            });
            // Keep max 10
            if (history.length > 10) history = history.slice(0, 10);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        }

        function showHistory() {
            const HISTORY_KEY = 'skillnest_roadmap_history_' + _uemail();
            let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            if (history.length <= 1) return; // Don't show if only current one

            const panel = document.getElementById('historyPanel');
            const list = document.getElementById('historyList');
            panel.style.display = 'block';

            list.innerHTML = history.slice(1).map(function (item) {
                return '<div style="background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); border-radius:10px; padding:14px 18px; margin-bottom:10px; cursor:pointer; transition:0.2s;" onmouseover="this.style.borderColor=\'rgba(168,85,247,0.3)\'" onmouseout="this.style.borderColor=\'rgba(255,255,255,0.06)\'" onclick="loadFromHistory(' + item.id + ')"><div style="display:flex; justify-content:space-between; align-items:center;"><strong style="font-size:14px;">' + item.goal + '</strong><span style="font-size:12px; color:#888;">' + item.date + '</span></div><p style="font-size:12px; color:#8892b0; margin-top:4px;">From: ' + item.skills + ' &bull; ' + item.weeks + ' weeks</p></div>';
            }).join('');
        }

        function loadFromHistory(id) {
            const HISTORY_KEY = 'skillnest_roadmap_history_' + _uemail();
            let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            const item = history.find(h => h.id === id);
            if (item) {
                document.getElementById("inputSection").style.display = "none";
                displayRoadmap(item.roadmap, item.skills, item.goal);
            }
        }

        // On page load, check if there's a recent roadmap to show
        (function loadRecent() {
            const HISTORY_KEY = 'skillnest_roadmap_history_' + _uemail();
            let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            if (history.length > 0) {
                const recent = history[0];
                document.getElementById("inputSection").style.display = "none";
                displayRoadmap(recent.roadmap, recent.skills, recent.goal);
                showHistory();
                // Add a "New Roadmap" button
                const btn = document.createElement('button');
                btn.innerText = '+ Generate New Roadmap';
                btn.style.cssText = 'display:block; margin:20px auto; padding:10px 20px; background:transparent; border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:white; font-size:14px; cursor:pointer;';
                btn.onclick = function () { document.getElementById("inputSection").style.display = "block"; document.getElementById("roadmapOutput").classList.remove("show"); document.getElementById("roadmapOutput").innerHTML = ''; document.getElementById("historyPanel").style.display = 'none'; btn.remove(); };
                document.getElementById("roadmapOutput").after(btn);
            }
        })();

        function createRoadmap(currentSkills, goal, hoursPerWeek, specificGoals) {
            const skillsLower = currentSkills.toLowerCase();
            const goalLower = goal.toLowerCase();

            // Roadmap templates based on goals
            if (goalLower.includes("full stack") || goalLower.includes("fullstack") || goalLower.includes("web")) {
                return getFullStackRoadmap(skillsLower, hoursPerWeek);
            }

            if (goalLower.includes("data science") || goalLower.includes("data") || goalLower.includes("analytics")) {
                return getDataScienceRoadmap(skillsLower, hoursPerWeek);
            }

            if (goalLower.includes("ai") || goalLower.includes("machine learning") || goalLower.includes("ml") || goalLower.includes("deep learning")) {
                return getMLRoadmap(skillsLower, hoursPerWeek);
            }

            if (goalLower.includes("frontend") || goalLower.includes("react") || goalLower.includes("ui")) {
                return getFrontendRoadmap(skillsLower, hoursPerWeek);
            }

            if (goalLower.includes("backend") || goalLower.includes("node") || goalLower.includes("api")) {
                return getBackendRoadmap(skillsLower, hoursPerWeek);
            }

            if (goalLower.includes("mobile") || goalLower.includes("app") || goalLower.includes("android") || goalLower.includes("ios")) {
                return getMobileRoadmap(skillsLower, hoursPerWeek);
            }

            // Default: Full stack
            return getFullStackRoadmap(skillsLower, hoursPerWeek);
        }

        function getFullStackRoadmap(skills, hours) {
            let weeks = [];
            let weekNum = 1;

            if (!skills.includes("html") && !skills.includes("css")) {
                weeks.push({ week: weekNum++, title: "HTML & CSS Fundamentals", desc: "Learn page structure, semantic HTML, CSS selectors, flexbox, and grid layout", topics: ["HTML5", "CSS3", "Flexbox", "Grid", "Responsive Design"], hours: hours });
            }

            if (!skills.includes("javascript") && !skills.includes("js")) {
                weeks.push({ week: weekNum++, title: "JavaScript Essentials", desc: "Variables, functions, arrays, objects, DOM manipulation, and events", topics: ["ES6+", "DOM", "Events", "Arrays", "Objects"], hours: hours });
                weeks.push({ week: weekNum++, title: "Advanced JavaScript", desc: "Async/await, promises, closures, prototypes, and error handling", topics: ["Async/Await", "Promises", "Closures", "Fetch API", "Error Handling"], hours: hours });
            }

            if (!skills.includes("react")) {
                weeks.push({ week: weekNum++, title: "React Fundamentals", desc: "Components, JSX, props, state, and the virtual DOM concept", topics: ["JSX", "Components", "Props", "State", "Virtual DOM"], hours: hours });
                weeks.push({ week: weekNum++, title: "React Advanced", desc: "Hooks, context API, routing, and building a real project", topics: ["Hooks", "Context", "React Router", "Custom Hooks", "Project"], hours: hours });
            }

            if (!skills.includes("node") && !skills.includes("express") && !skills.includes("backend")) {
                weeks.push({ week: weekNum++, title: "Node.js & Express", desc: "Server basics, routing, middleware, REST APIs, and error handling", topics: ["Node.js", "Express", "REST APIs", "Middleware", "Error Handling"], hours: hours });
            }

            if (!skills.includes("database") && !skills.includes("mongo") && !skills.includes("sql")) {
                weeks.push({ week: weekNum++, title: "Databases", desc: "MongoDB basics, CRUD operations, Mongoose ODM, and data modeling", topics: ["MongoDB", "Mongoose", "CRUD", "Schema Design", "SQL basics"], hours: hours });
            }

            weeks.push({ week: weekNum++, title: "Authentication & Security", desc: "JWT tokens, bcrypt, sessions, and protecting routes", topics: ["JWT", "bcrypt", "Auth middleware", "Sessions", "Security"], hours: hours });
            weeks.push({ week: weekNum++, title: "Full Stack Project", desc: "Build a complete app with frontend, backend, database, and deploy it", topics: ["Project Planning", "Integration", "Deployment", "Vercel/Render", "Git"], hours: hours });
            weeks.push({ week: weekNum++, title: "DevOps & Career Prep", desc: "Docker basics, CI/CD, portfolio website, and interview preparation", topics: ["Docker", "CI/CD", "Portfolio", "Resume", "Interview Prep"], hours: hours });

            return weeks;
        }

        function getDataScienceRoadmap(skills, hours) {
            let weeks = [];
            let weekNum = 1;

            if (!skills.includes("python")) {
                weeks.push({ week: weekNum++, title: "Python Fundamentals", desc: "Variables, loops, functions, lists, dictionaries, and file I/O", topics: ["Python Basics", "Data Types", "Functions", "Loops", "File I/O"], hours: hours });
            }

            weeks.push({ week: weekNum++, title: "NumPy & Pandas", desc: "Array operations, DataFrames, data cleaning, and manipulation", topics: ["NumPy", "Pandas", "DataFrames", "Data Cleaning", "Indexing"], hours: hours });
            weeks.push({ week: weekNum++, title: "Data Visualization", desc: "Matplotlib, Seaborn, and creating insightful charts", topics: ["Matplotlib", "Seaborn", "Plotly", "Charts", "Dashboards"], hours: hours });
            weeks.push({ week: weekNum++, title: "Statistics & Probability", desc: "Descriptive stats, distributions, hypothesis testing", topics: ["Mean/Median", "Distributions", "Hypothesis Testing", "Correlation", "P-values"], hours: hours });
            weeks.push({ week: weekNum++, title: "SQL for Data Science", desc: "Queries, joins, aggregations, and working with databases", topics: ["SQL Queries", "JOINs", "GROUP BY", "Subqueries", "Window Functions"], hours: hours });
            weeks.push({ week: weekNum++, title: "Machine Learning Basics", desc: "Scikit-learn, regression, classification, and model evaluation", topics: ["Scikit-learn", "Regression", "Classification", "Train/Test", "Evaluation"], hours: hours });
            weeks.push({ week: weekNum++, title: "Advanced ML & Projects", desc: "Random forests, XGBoost, clustering, and a capstone project", topics: ["Random Forest", "XGBoost", "Clustering", "Feature Engineering", "Project"], hours: hours });
            weeks.push({ week: weekNum++, title: "Portfolio & Career", desc: "Kaggle competitions, portfolio projects, and job preparation", topics: ["Kaggle", "Portfolio", "GitHub", "Resume", "Interview Prep"], hours: hours });

            return weeks;
        }

        function getMLRoadmap(skills, hours) {
            let weeks = [];
            let weekNum = 1;

            if (!skills.includes("python")) {
                weeks.push({ week: weekNum++, title: "Python for ML", desc: "Python basics, NumPy, and mathematical foundations", topics: ["Python", "NumPy", "Linear Algebra", "Calculus Basics", "Statistics"], hours: hours });
            }

            weeks.push({ week: weekNum++, title: "Data Preprocessing", desc: "Pandas, data cleaning, feature engineering, and EDA", topics: ["Pandas", "EDA", "Feature Engineering", "Missing Data", "Scaling"], hours: hours });
            weeks.push({ week: weekNum++, title: "Supervised Learning", desc: "Linear/logistic regression, decision trees, SVMs", topics: ["Regression", "Classification", "Decision Trees", "SVM", "KNN"], hours: hours });
            weeks.push({ week: weekNum++, title: "Model Evaluation", desc: "Cross-validation, metrics, hyperparameter tuning", topics: ["Cross-validation", "Precision/Recall", "ROC-AUC", "Grid Search", "Overfitting"], hours: hours });
            weeks.push({ week: weekNum++, title: "Ensemble Methods", desc: "Random forests, boosting, bagging, and stacking", topics: ["Random Forest", "XGBoost", "LightGBM", "Bagging", "Stacking"], hours: hours });
            weeks.push({ week: weekNum++, title: "Deep Learning", desc: "Neural networks, TensorFlow/PyTorch, CNNs", topics: ["Neural Networks", "TensorFlow", "PyTorch", "CNNs", "Backpropagation"], hours: hours });
            weeks.push({ week: weekNum++, title: "NLP & Computer Vision", desc: "Text processing, transformers, image classification", topics: ["NLP", "Transformers", "BERT", "Image Classification", "Transfer Learning"], hours: hours });
            weeks.push({ week: weekNum++, title: "Projects & Deployment", desc: "Build end-to-end ML pipelines and deploy models", topics: ["MLOps", "Flask/FastAPI", "Docker", "AWS/GCP", "Projects"], hours: hours });

            return weeks;
        }

        function getFrontendRoadmap(skills, hours) {
            let weeks = [];
            let weekNum = 1;

            if (!skills.includes("html") || !skills.includes("css")) {
                weeks.push({ week: weekNum++, title: "HTML & CSS Mastery", desc: "Semantic HTML, advanced CSS, animations, and responsive design", topics: ["Semantic HTML", "CSS Grid", "Animations", "Media Queries", "BEM"], hours: hours });
            }

            if (!skills.includes("javascript")) {
                weeks.push({ week: weekNum++, title: "JavaScript Deep Dive", desc: "ES6+, DOM, async patterns, and module systems", topics: ["ES6+", "DOM", "Async/Await", "Modules", "Error Handling"], hours: hours });
            }

            weeks.push({ week: weekNum++, title: "React Fundamentals", desc: "JSX, components, props, state, and the component lifecycle", topics: ["JSX", "Components", "Props", "useState", "useEffect"], hours: hours });
            weeks.push({ week: weekNum++, title: "React Ecosystem", desc: "React Router, state management, and API integration", topics: ["React Router", "Context", "Redux/Zustand", "Axios", "API Calls"], hours: hours });
            weeks.push({ week: weekNum++, title: "TypeScript + Next.js", desc: "Type safety, server-side rendering, and modern React patterns", topics: ["TypeScript", "Next.js", "SSR", "ISR", "API Routes"], hours: hours });
            weeks.push({ week: weekNum++, title: "Testing & Performance", desc: "Unit testing, E2E testing, performance optimization", topics: ["Jest", "React Testing Library", "Lighthouse", "Code Splitting", "Lazy Loading"], hours: hours });
            weeks.push({ week: weekNum++, title: "UI/UX & Design Systems", desc: "Tailwind CSS, component libraries, accessibility", topics: ["Tailwind", "Shadcn", "A11y", "Figma", "Design Systems"], hours: hours });
            weeks.push({ week: weekNum++, title: "Portfolio & Deployment", desc: "Build portfolio, deploy projects, prepare for interviews", topics: ["Portfolio", "Vercel", "Netlify", "GitHub", "Interview Prep"], hours: hours });

            return weeks;
        }

        function getBackendRoadmap(skills, hours) {
            let weeks = [];
            let weekNum = 1;

            if (!skills.includes("javascript") && !skills.includes("node")) {
                weeks.push({ week: weekNum++, title: "JavaScript & Node.js", desc: "JS fundamentals, Node runtime, npm, and modules", topics: ["JavaScript", "Node.js", "npm", "Modules", "Event Loop"], hours: hours });
            }

            weeks.push({ week: weekNum++, title: "Express.js & APIs", desc: "Routes, middleware, CRUD, and REST principles", topics: ["Express", "REST", "CRUD", "Middleware", "Error Handling"], hours: hours });
            weeks.push({ week: weekNum++, title: "Databases", desc: "MongoDB, PostgreSQL, ORMs, and data modeling", topics: ["MongoDB", "PostgreSQL", "Mongoose", "Prisma", "Schema Design"], hours: hours });
            weeks.push({ week: weekNum++, title: "Authentication", desc: "JWT, OAuth, sessions, and security best practices", topics: ["JWT", "OAuth 2.0", "bcrypt", "CORS", "Rate Limiting"], hours: hours });
            weeks.push({ week: weekNum++, title: "Advanced Patterns", desc: "WebSockets, queues, caching, and microservices intro", topics: ["WebSockets", "Redis", "Message Queues", "Caching", "Microservices"], hours: hours });
            weeks.push({ week: weekNum++, title: "Testing & Documentation", desc: "Unit tests, integration tests, and API docs", topics: ["Jest", "Supertest", "Swagger", "Postman", "CI/CD"], hours: hours });
            weeks.push({ week: weekNum++, title: "DevOps & Deployment", desc: "Docker, cloud platforms, monitoring, and scaling", topics: ["Docker", "AWS/GCP", "Nginx", "PM2", "Monitoring"], hours: hours });
            weeks.push({ week: weekNum++, title: "System Design & Career", desc: "Design patterns, scaling strategies, interview prep", topics: ["System Design", "Load Balancing", "Database Scaling", "Design Patterns", "Interviews"], hours: hours });

            return weeks;
        }

        function getMobileRoadmap(skills, hours) {
            let weeks = [];
            let weekNum = 1;

            if (!skills.includes("javascript") && !skills.includes("react")) {
                weeks.push({ week: weekNum++, title: "JavaScript & React Basics", desc: "JS fundamentals and React component model", topics: ["JavaScript", "React", "JSX", "State", "Props"], hours: hours });
            }

            weeks.push({ week: weekNum++, title: "React Native Setup", desc: "Environment setup, Expo, and first mobile app", topics: ["React Native", "Expo", "Setup", "Components", "Styling"], hours: hours });
            weeks.push({ week: weekNum++, title: "Navigation & UI", desc: "Screen navigation, forms, and native UI components", topics: ["React Navigation", "Stack/Tab", "Forms", "FlatList", "Modals"], hours: hours });
            weeks.push({ week: weekNum++, title: "State & APIs", desc: "State management, API calls, and async storage", topics: ["Context/Redux", "Fetch/Axios", "AsyncStorage", "Loading States", "Error Handling"], hours: hours });
            weeks.push({ week: weekNum++, title: "Device Features", desc: "Camera, location, notifications, and permissions", topics: ["Camera", "Location", "Push Notifications", "Permissions", "Maps"], hours: hours });
            weeks.push({ week: weekNum++, title: "Backend Integration", desc: "Firebase, authentication, and real-time data", topics: ["Firebase", "Auth", "Firestore", "Real-time", "Cloud Functions"], hours: hours });
            weeks.push({ week: weekNum++, title: "Performance & Testing", desc: "Optimization, debugging, and testing", topics: ["Performance", "Debugging", "Jest", "Detox", "Profiling"], hours: hours });
            weeks.push({ week: weekNum++, title: "Publishing", desc: "App Store/Play Store deployment and marketing", topics: ["App Store", "Play Store", "ASO", "CI/CD", "Analytics"], hours: hours });

            return weeks;
        }

        function displayRoadmap(weeks, skills, goal) {
            const output = document.getElementById("roadmapOutput");
            const totalWeeks = weeks.length;
            const ROADMAP_KEY = 'skillnest_roadmap_progress_' + _uemail();

            // Load saved progress
            let saved = JSON.parse(localStorage.getItem(ROADMAP_KEY) || '{}');

            let html = `
                <div class="roadmap-title">
                    <h2>Your Personalized Roadmap</h2>
                    <p>From "${skills}" &rarr; "${goal}" in ${totalWeeks} weeks</p>
                </div>
            `;

            weeks.forEach(week => {
                const topicTags = week.topics.map(t => `<span class="topic-tag">${t}</span>`).join('');
                // Generate 5 daily tasks per week based on topics
                const days = generateDailyTasks(week);
                const weekKey = 'week' + week.week;
                const savedWeek = saved[weekKey] || {};

                let tasksHTML = days.map((day, idx) => {
                    const taskKey = weekKey + '_day' + idx;
                    const checked = savedWeek[idx] ? 'checked' : '';
                    return `<div class="day-task"><label><input type="checkbox" ${checked} onchange="toggleTask('${weekKey}', ${idx}, this.checked, ${totalWeeks})"><span class="day-label">Day ${idx + 1}:</span> ${day}</label></div>`;
                }).join('');

                html += `
                    <div class="week-card" onclick="toggleWeekExpand(this, event)" style="cursor:pointer;">
                        <div class="week-number">Week ${week.week}</div>
                        <div class="hours">${week.hours} hrs</div>
                        <h3>${week.title} <span class="expand-icon" style="font-size:14px;color:#8892b0;">&#9660;</span></h3>
                        <p>${week.desc}</p>
                        <div class="topics">${topicTags}</div>
                        <div class="week-tasks" style="display:none; margin-top:15px; border-top:1px solid rgba(255,255,255,0.06); padding-top:15px;">
                            <p style="font-size:12px; color:#A855F7; font-weight:600; margin-bottom:10px;">DAILY TASKS</p>
                            ${tasksHTML}
                        </div>
                    </div>
                `;
            });

            // Calculate initial progress
            let totalTasks = totalWeeks * 5;
            let completedTasks = 0;
            Object.values(saved).forEach(weekData => {
                Object.values(weekData).forEach(v => { if (v) completedTasks++; });
            });
            let progressPercent = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

            html += `
                <div class="progress-section">
                    <h4>Your Progress</h4>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width:${progressPercent}%"></div>
                    </div>
                    <p class="progress-text" id="progressText">${completedTasks} / ${totalTasks} tasks completed (${progressPercent}%)</p>
                </div>
            `;

            // Add course & mentor recommendations based on goal
            html += generateRecommendations(goal, skills);

            output.innerHTML = html;
            output.classList.add("show");
        }

        function generateRecommendations(goal, skills) {
            const goalLower = goal.toLowerCase();
            let courses = [];
            let mentorSkills = [];

            if (goalLower.includes('full stack') || goalLower.includes('web')) {
                courses = [{ name: 'The Odin Project', url: 'https://www.theodinproject.com', desc: 'Free full stack curriculum' }, { name: 'freeCodeCamp', url: 'https://www.freecodecamp.org', desc: 'Learn to code for free' }, { name: 'MDN Web Docs', url: 'https://developer.mozilla.org', desc: 'Official web development reference' }];
                mentorSkills = ['React', 'Node.js', 'JavaScript'];
            } else if (goalLower.includes('data') || goalLower.includes('analytics')) {
                courses = [{ name: 'Kaggle Learn', url: 'https://www.kaggle.com/learn', desc: 'Free micro-courses on data science' }, { name: 'DataCamp', url: 'https://www.datacamp.com', desc: 'Interactive data science courses' }, { name: 'Khan Academy Statistics', url: 'https://www.khanacademy.org/math/statistics-probability', desc: 'Statistics fundamentals' }];
                mentorSkills = ['Python', 'Data Science', 'SQL'];
            } else if (goalLower.includes('ai') || goalLower.includes('ml') || goalLower.includes('machine learning')) {
                courses = [{ name: 'fast.ai', url: 'https://www.fast.ai', desc: 'Practical deep learning for coders' }, { name: 'Andrew Ng ML Course', url: 'https://www.coursera.org/learn/machine-learning', desc: 'Stanford ML on Coursera' }, { name: 'Hugging Face Course', url: 'https://huggingface.co/learn', desc: 'NLP and transformers' }];
                mentorSkills = ['Machine Learning', 'Python', 'AI'];
            } else if (goalLower.includes('frontend') || goalLower.includes('react')) {
                courses = [{ name: 'React.dev', url: 'https://react.dev/learn', desc: 'Official React documentation' }, { name: 'JavaScript.info', url: 'https://javascript.info', desc: 'Modern JavaScript tutorial' }, { name: 'CSS Tricks', url: 'https://css-tricks.com', desc: 'CSS guides and techniques' }];
                mentorSkills = ['React', 'JavaScript', 'CSS'];
            } else if (goalLower.includes('backend') || goalLower.includes('node')) {
                courses = [{ name: 'Node.js Docs', url: 'https://nodejs.org/en/learn', desc: 'Official Node.js guides' }, { name: 'Express.js Guide', url: 'https://expressjs.com/en/guide', desc: 'Express framework guide' }, { name: 'PostgreSQL Tutorial', url: 'https://www.postgresqltutorial.com', desc: 'Learn PostgreSQL step by step' }];
                mentorSkills = ['Node.js', 'Express', 'PostgreSQL'];
            } else {
                courses = [{ name: 'freeCodeCamp', url: 'https://www.freecodecamp.org', desc: 'Learn to code for free' }, { name: 'Coursera', url: 'https://www.coursera.org', desc: 'University courses online' }, { name: 'edX', url: 'https://www.edx.org', desc: 'Free courses from top institutions' }];
                mentorSkills = ['Programming', 'Technology'];
            }

            let html = '<div style="margin-top:30px; background:rgba(168,85,247,0.05); border:1px solid rgba(168,85,247,0.15); border-radius:14px; padding:24px;">';
            html += '<h4 style="font-size:16px; margin-bottom:15px; display:flex; align-items:center; gap:8px;"><span class="material-icons" style="font-size:20px; color:#A855F7;">school</span> Recommended Resources</h4>';
            html += '<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-bottom:20px;">';
            courses.forEach(function (c) {
                html += '<a href="' + c.url + '" target="_blank" style="background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); border-radius:10px; padding:14px; text-decoration:none; color:#ccc; transition:0.2s; display:block;" onmouseover="this.style.borderColor=\'#A855F7\'" onmouseout="this.style.borderColor=\'rgba(255,255,255,0.06)\'"><strong style="font-size:14px; color:white; display:block; margin-bottom:4px;">' + c.name + '</strong><span style="font-size:12px; color:#8892b0;">' + c.desc + '</span></a>';
            });
            html += '</div>';

            // Mentor recommendation
            html += '<h4 style="font-size:14px; margin-bottom:10px; color:#8892b0;">Look for mentors skilled in: <span style="color:#FF4FA3;">' + mentorSkills.join(', ') + '</span></h4>';
            html += '<a href="action.html" style="display:inline-flex; align-items:center; gap:6px; padding:8px 16px; background:linear-gradient(45deg,#FF4FA3,#A855F7); border-radius:8px; color:white; text-decoration:none; font-size:13px; font-weight:600;">Browse Mentors</a>';
            html += '</div>';
            return html;
        }

        function generateDailyTasks(week) {
            // Create 5 daily tasks from the week's topics
            const tasks = [];
            const topics = week.topics;
            const taskTemplates = [
                'Study and take notes on {topic}',
                'Practice {topic} with exercises',
                'Build a mini-project using {topic}',
                'Review and revise {topic} concepts',
                'Solve 3 problems related to {topic}'
            ];
            for (let i = 0; i < 5; i++) {
                const topic = topics[i % topics.length];
                tasks.push(taskTemplates[i].replace('{topic}', topic));
            }
            return tasks;
        }

        function toggleWeekExpand(card, event) {
            // Don't toggle if clicking a checkbox
            if (event.target.type === 'checkbox') return;
            const tasks = card.querySelector('.week-tasks');
            const icon = card.querySelector('.expand-icon');
            if (tasks.style.display === 'none') {
                tasks.style.display = 'block';
                icon.innerHTML = '&#9650;';
            } else {
                tasks.style.display = 'none';
                icon.innerHTML = '&#9660;';
            }
        }

        function toggleTask(weekKey, dayIdx, checked, totalWeeks) {
            const ROADMAP_KEY = 'skillnest_roadmap_progress_' + _uemail();
            let saved = JSON.parse(localStorage.getItem(ROADMAP_KEY) || '{}');
            if (!saved[weekKey]) saved[weekKey] = {};
            saved[weekKey][dayIdx] = checked;
            localStorage.setItem(ROADMAP_KEY, JSON.stringify(saved));

            // Update progress bar
            let totalTasks = totalWeeks * 5;
            let completedTasks = 0;
            Object.values(saved).forEach(weekData => {
                Object.values(weekData).forEach(v => { if (v) completedTasks++; });
            });
            let progressPercent = Math.round((completedTasks / totalTasks) * 100);
            document.getElementById('progressFill').style.width = progressPercent + '%';
            document.getElementById('progressText').innerText = completedTasks + ' / ' + totalTasks + ' tasks completed (' + progressPercent + '%)';

            // Update dashboard data
            var d = JSON.parse(localStorage.getItem('skillnest_user_data') || '{}');
            d.milestones = completedTasks;
            localStorage.setItem('skillnest_user_data', JSON.stringify(d));
        }
    </script>
