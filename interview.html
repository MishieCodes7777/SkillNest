<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Practice - SkillNest</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #050816;
            color: white;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 30px 40px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 35px;
            padding-left: 60px;
        }

        .page-header h1 {
            font-size: 26px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .page-header h1 .material-icons {
            color: #FF4FA3;
            font-size: 28px;
        }

        .page-header p {
            color: #8892b0;
            font-size: 14px;
        }

        /* Input section */
        .input-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
        }

        .input-card h3 {
            font-size: 16px;
            margin-bottom: 18px;
        }

        .form-row {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .form-row input,
        .form-row select {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .form-row input:focus,
        .form-row select:focus {
            border-color: #A855F7;
        }

        .form-row select {
            appearance: none;
            cursor: pointer;
        }

        .topic-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }

        .chip {
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            font-size: 13px;
            color: #ccc;
            cursor: pointer;
            transition: 0.2s;
        }

        .chip:hover {
            border-color: #FF4FA3;
            color: white;
        }

        .chip.active {
            background: linear-gradient(45deg, #FF4FA3, #A855F7);
            border-color: transparent;
            color: white;
        }

        .gen-btn {
            padding: 12px 24px;
            background: linear-gradient(45deg, #FF4FA3, #A855F7);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .gen-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 79, 163, 0.3);
        }

        .gen-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading */
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #FF4FA3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Results */
        .results {
            display: none;
        }

        .results.show {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .result-card h3 {
            font-size: 17px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .result-card h3 .material-icons {
            color: #A855F7;
            font-size: 20px;
        }

        /* Syllabus content */
        .syllabus-content {
            font-size: 14px;
            line-height: 1.8;
            color: #ccc;
        }

        .syllabus-content h1,
        .syllabus-content h2,
        .syllabus-content h3 {
            color: white;
            margin: 15px 0 8px;
            font-size: 16px;
        }

        .syllabus-content ul {
            margin-left: 20px;
            margin-bottom: 10px;
        }

        .syllabus-content li {
            margin-bottom: 4px;
        }

        .syllabus-content strong {
            color: #FF4FA3;
        }

        .syllabus-content code {
            background: rgba(168, 85, 247, 0.15);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
            color: #c4a5ff;
        }

        /* Question cards */
        .q-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .q-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 16px;
            transition: 0.2s;
        }

        .q-card:hover {
            border-color: rgba(168, 85, 247, 0.3);
        }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .q-header h4 {
            font-size: 14px;
            flex: 1;
        }

        .q-diff {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .q-diff.Easy {
            background: rgba(52, 199, 89, 0.15);
            color: #34c759;
        }

        .q-diff.Medium {
            background: rgba(245, 166, 35, 0.15);
            color: #f5a623;
        }

        .q-diff.Hard {
            background: rgba(255, 77, 77, 0.15);
            color: #ff4d4d;
        }

        .q-meta {
            font-size: 12px;
            color: #8892b0;
            margin-bottom: 6px;
        }

        .q-hint {
            font-size: 13px;
            color: #666;
            font-style: italic;
            display: none;
            margin-top: 8px;
            padding: 8px 12px;
            background: rgba(168, 85, 247, 0.05);
            border-radius: 6px;
        }

        .q-hint.show {
            display: block;
        }

        .hint-btn {
            font-size: 12px;
            color: #A855F7;
            cursor: pointer;
            border: none;
            background: none;
            margin-top: 6px;
        }

        .hint-btn:hover {
            text-decoration: underline;
        }

        /* Retry */
        .retry-btn {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .retry-btn:hover {
            border-color: #FF4FA3;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="page-header">
            <h1><span class="material-icons">psychology</span> AI Interview Practice</h1>
            <p>Prepare for your dream company with AI-powered interview questions</p>
        </div>

        <!-- Input -->
        <div class="input-card" id="inputCard">
            <h3>Which company are you preparing for?</h3>
            <div class="form-row">
                <input type="text" id="companyInput" placeholder="e.g. Google, Amazon, Microsoft, Meta, Flipkart...">
            </div>

            <p style="font-size:13px;color:#8892b0;margin-bottom:10px;">Select a topic (or leave empty for full
                syllabus):</p>
            <div class="topic-chips">
                <div class="chip" onclick="selectTopic(this,'')">Full Syllabus</div>
                <div class="chip" onclick="selectTopic(this,'DSA')">DSA</div>
                <div class="chip" onclick="selectTopic(this,'OS')">Operating Systems</div>
                <div class="chip" onclick="selectTopic(this,'DBMS')">DBMS</div>
                <div class="chip" onclick="selectTopic(this,'System Design')">System Design</div>
                <div class="chip" onclick="selectTopic(this,'OOPs')">OOPs</div>
                <div class="chip" onclick="selectTopic(this,'Computer Networks')">CN</div>
                <div class="chip" onclick="selectTopic(this,'Behavioral')">Behavioral</div>
            </div>

            <button class="gen-btn" id="genBtn" onclick="startPrep()">
                <span class="material-icons" style="font-size:20px;">auto_awesome</span>
                Generate Interview Prep
            </button>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="color:#8892b0;">AI is fetching interview data...</p>
        </div>

        <!-- Results -->
        <div class="results" id="results"></div>
    </div>

    <script>
        var selectedTopic = '';

        function selectTopic(el, topic) {
            document.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('active'); });
            el.classList.add('active');
            selectedTopic = topic;
        }

        async function startPrep() {
            var company = document.getElementById('companyInput').value.trim();
            if (!company) { alert('Please enter a company name'); return; }

            var btn = document.getElementById('genBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="material-icons" style="font-size:20px;">hourglass_top</span> Generating...';

            document.getElementById('inputCard').style.display = 'none';
            document.getElementById('loading').classList.add('show');

            try {
                // First get syllabus
                var syllabusRes = await fetch('/api/ai/interview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ company: company, topic: '' })
                });
                var syllabusData = await syllabusRes.json();

                // Then get questions if topic selected
                var questionsData = null;
                if (selectedTopic) {
                    var qRes = await fetch('/api/ai/interview', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ company: company, topic: selectedTopic })
                    });
                    questionsData = await qRes.json();
                }

                document.getElementById('loading').classList.remove('show');
                displayResults(company, syllabusData, questionsData);
            } catch (err) {
                document.getElementById('loading').classList.remove('show');
                document.getElementById('results').innerHTML = '<div class="result-card"><p style="color:#ff4d4d;">Failed to connect. Make sure the server is running.</p></div>';
                document.getElementById('results').classList.add('show');
            }

            btn.disabled = false;
            btn.innerHTML = '<span class="material-icons" style="font-size:20px;">auto_awesome</span> Generate Interview Prep';
        }

        function displayResults(company, syllabusData, questionsData) {
            var html = '<h2 style="font-size:22px;margin-bottom:20px;text-align:center;">Interview Prep: <span style="color:#FF4FA3;">' + company + '</span></h2>';

            // Syllabus
            if (syllabusData && syllabusData.success) {
                html += '<div class="result-card"><h3><span class="material-icons">menu_book</span> Interview Syllabus</h3>';
                html += '<div class="syllabus-content">' + formatMarkdown(syllabusData.response) + '</div></div>';
            }

            // Questions
            if (questionsData && questionsData.success) {
                html += '<div class="result-card"><h3><span class="material-icons">quiz</span> ' + selectedTopic + ' Questions</h3>';

                // Try to parse as JSON
                var questions = null;
                try {
                    var cleaned = questionsData.response.trim();
                    // Find JSON array in response
                    var start = cleaned.indexOf('[');
                    var end = cleaned.lastIndexOf(']') + 1;
                    if (start !== -1 && end > start) {
                        questions = JSON.parse(cleaned.substring(start, end));
                    }
                } catch (e) { }

                if (questions && Array.isArray(questions)) {
                    html += '<div class="q-list">';
                    questions.forEach(function (q, i) {
                        html += '<div class="q-card"><div class="q-header"><h4>' + (i + 1) + '. ' + q.question + '</h4><span class="q-diff ' + (q.difficulty || 'Medium') + '">' + (q.difficulty || 'Medium') + '</span></div>';
                        if (q.topic) html += '<div class="q-meta">Topic: ' + q.topic + '</div>';
                        if (q.hint) html += '<button class="hint-btn" onclick="this.nextElementSibling.classList.toggle(\'show\')">Show Hint</button><div class="q-hint">' + q.hint + '</div>';
                        html += '</div>';
                    });
                    html += '</div>';
                } else {
                    // Show raw response formatted
                    html += '<div class="syllabus-content">' + formatMarkdown(questionsData.response) + '</div>';
                }
                html += '</div>';
            }

            // Try another
            html += '<button class="retry-btn" onclick="tryAnother()"><span class="material-icons" style="font-size:16px;vertical-align:middle;">refresh</span> Try Another Company</button>';

            document.getElementById('results').innerHTML = html;
            document.getElementById('results').classList.add('show');
        }

        function formatMarkdown(text) {
            if (!text) return '';
            // Bold
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            // Headers
            text = text.replace(/^### (.*?)$/gm, '<h3>$1</h3>');
            text = text.replace(/^## (.*?)$/gm, '<h2>$1</h2>');
            text = text.replace(/^# (.*?)$/gm, '<h1>$1</h1>');
            // Lists
            text = text.replace(/^- (.*?)$/gm, '<li>$1</li>');
            text = text.replace(/^• (.*?)$/gm, '<li>$1</li>');
            text = text.replace(/^\d+\. (.*?)$/gm, '<li>$1</li>');
            // Code
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            // Line breaks
            text = text.replace(/\n/g, '<br>');
            return text;
        }

        function tryAnother() {
            document.getElementById('inputCard').style.display = 'block';
            document.getElementById('results').classList.remove('show');
            document.getElementById('results').innerHTML = '';
            document.getElementById('companyInput').value = '';
            document.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('active'); });
            selectedTopic = '';
        }
    </script>
    <script src="public/Assets/js/sidebar.js"></script>
</body>

</html>
