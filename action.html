<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create or Join Meeting</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="public/Assets/css/style.css">

</head>


<body style="padding-top: 3.5rem;">
    <div
        style="display:flex; justify-content:space-between; padding:15px 30px; background:#1c1c2e; align-items:center;">

        <h2 onclick="goDashboard()" style="color:#ff4fa3; margin:0; cursor:pointer;">
        SkillNest
        </h2>

        <button onclick="window.location.href='home.html'"
            style="background:linear-gradient(45deg,#ff4fa3,#b983ff); border:none; padding:8px 15px; border-radius:10px; color:white;">
            Home
        </button>

    </div>
    <main class="jumbotron h-100 d-flex" style="background:#0f0f1a; color:white;">
        <div class="container" style="display:flex; flex-direction:column; justify-content:center;">



            <ul class="display-center">
                <li style="padding: 0;">

                    <h1
                        style="font-size:40px; background:linear-gradient(45deg,#ff4fa3,#6c63ff); -webkit-background-clip:text; color:transparent;">
                        Start or Join a Session
                    </h1>

                    <p style="color:#ccc;">
                        Connect with mentors and learn in real-time.
                    </p>

                    <button id="newMeetingBtn"
                        style="background:linear-gradient(45deg,#ff4fa3,#b983ff); border:none; padding:12px 20px; border-radius:10px; color:white; display:flex; align-items:center; gap:5px;">
                        <span class="material-icons">video_call</span>
                        New Session
                    </button>

                </li>
                <li class="pl-3">



                    <button class="btn btn-outline-secondary">
                        <span class="material-icons">keyboard</span>
                    </button>
                    <input type="text" id="username" placeholder="Enter your name"
                        style="width:300px; height:45px; border-radius:10px; margin-bottom:10px; padding-left:10px; border:none; background:#1c1c2e; color:white;">
                    <input type="text" placeholder="Enter Session Code"
                        style="width:300px; height:45px; border-radius:10px; padding-left:10px; border:none; background:#1c1c2e; color:white;">

                    <button
                        style="background:#6c63ff; border:none; padding:10px 20px; border-radius:10px; color:white;">
                        Join
                    </button>

        </div>

        </li>


        </ul>
        </div>
        <div class="col-md-6 text-center" style="border:none;">
            <main>

                <div class="jumbotron h-100 d-flex">

                    <div class="container w-50"></div>
                    <img src="public/Assets/images/google-meet-people.jpg" alt="" class="signin-image">
                </div>
            </main>

            <img src="public/assets/images/meet-grid.png" class="img-fluid rounded" alt="">

        </div>

        </div>
        </div>
    </main>

</body>
<script>
function goDashboard() {
    const params = new URLSearchParams(window.location.search);
    const user = params.get("user");

    if (user) {
        window.location.href = "dashboard.html?user=" + user;
    } else {
        window.location.href = "dashboard.html";
    }
}
</script>

</html>
