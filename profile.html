<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0d1117;
    color: white;
}

.container {
    display: flex;
}

.sidebar {
    width: 230px;
    background: #111820;
    padding: 20px;
    height: 100vh;
}

.logo {
    color: #ff4fa3;
    font-size: 22px;
    margin-bottom: 30px;
    cursor: pointer;
}

.nav-item {
    padding: 10px;
    color: #aaa;
    cursor: pointer;
}

.nav-item:hover {
    background: #1c1c2e;
    color: white;
}

.nav-item.active {
    background: #1c1c2e;
    color: white;
}

.main {
    flex: 1;
    padding: 30px;
}

.input-box {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.input-box input {
    padding: 10px;
    width: 350px;
    border-radius: 8px;
    border: none;
    background: #1c1c2e;
    color: white;
}

.input-box button {
    padding: 10px 15px;
    background: transparent;
    border: 1px solid #555;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

.profile-card {
    background: #161d27;
    padding: 20px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.avatar {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #2a2a3c;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: #ff4fa3;
}

.tags span {
    padding: 5px 10px;
    border-radius: 20px;
    margin-right: 5px;
    font-size: 12px;
}

.tag1 { background: #ff4fa3; }
.tag2 { background: #2563eb; }

.status {
    background: green;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
}

.stats {
    display: flex;
    gap: 20px;
    margin-top: 20px;
}

.box {
    background: #161d27;
    padding: 20px;
    border-radius: 10px;
    width: 150px;
}

.activity {
    margin-top: 30px;
    background: #161d27;
    padding: 20px;
    border-radius: 10px;
}
</style>

</head>

<body>

<div class="container">

    <div class="sidebar">
        <div class="logo" onclick="goToAction()">SkillNest</div>

        <div class="nav-item" onclick="goToAction()">Home</div>
        <div class="nav-item">My Sessions</div>
        <div class="nav-item">Messages</div>
        <div class="nav-item" onclick="goToDashboard()">Explore Skills</div>
        <div class="nav-item active">Profile</div>
    </div>

    <div class="main">

        <div class="input-box">
            <input id="emailInput" placeholder="Enter your login email">
            <button onclick="loadProfile()">Load profile</button>
        </div>

        <div class="profile-card">
            <div style="display:flex; gap:15px; align-items:center;">
                <div class="avatar" id="avatar">?</div>

                <div>
                    <h2 id="name">Your name</h2>
                    <p id="emailText">Enter your email above to load your profile</p>

                    <div class="tags">
                        <span class="tag1">React</span>
                        <span class="tag2">Python</span>
                    </div>

                    <div class="status">Active learner</div>
                </div>
            </div>

            <button>Edit profile</button>
        </div>

        <div class="stats">
            <div class="box">
                <h2>12</h2>
                <p>Sessions joined</p>
            </div>

            <div class="box">
                <h2>5</h2>
                <p>Skills explored</p>
            </div>

            <div class="box">
                <h2>94%</h2>
                <p>Attendance</p>
            </div>

            <div class="box">
                <h2>3</h2>
                <p>Badges</p>
            </div>
        </div>

        <div class="activity">
            <h3>Recent Activity</h3>
            <p>Joined React session</p>
            <p>Earned badge</p>
            <p>Posted in Python feed</p>
        </div>

    </div>

</div>

<script>

// USER
function getUser() {
    const params = new URLSearchParams(window.location.search);
    return params.get("user") || "";
}

// NAVIGATION (FIXED)
function goToAction() {
    const user = getUser();
    window.location.href = "action.html?user=" + user;
}

function goToDashboard() {
    const user = getUser();
    window.location.href = "dashboard.html?user=" + user;
}

// PROFILE LOAD
function loadProfile() {
    const email = document.getElementById("emailInput").value;

    if (!email) {
        alert("Enter email");
        return;
    }

    const name = email.split("@")[0];

    document.getElementById("name").innerText = name;
    document.getElementById("avatar").innerText = name.charAt(0).toUpperCase();
    document.getElementById("emailText").innerText = email;
}

// AUTO LOAD FROM URL
window.onload = function () {
    const user = getUser();

    if (user && user.includes("@")) {
        document.getElementById("emailInput").value = user;
        loadProfile();
    }
};

</script>

</body>
</html>
