<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - SkillNest</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #050816;
            color: white;
            min-height: 100vh;
        }

        .main {
            max-width: 800px;
            margin: 0 auto;
            padding: 80px 40px 40px;
        }

        .page-title {
            font-size: 24px;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 30px;
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 25px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(45deg, #FF4FA3, #A855F7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .profile-details h2 {
            font-size: 22px;
            margin-bottom: 4px;
        }

        .profile-details p {
            color: #8892b0;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .profile-role {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .role-learner {
            background: rgba(168, 85, 247, 0.15);
            color: #A855F7;
        }

        .role-mentor {
            background: rgba(255, 79, 163, 0.15);
            color: #FF4FA3;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 25px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 20px;
        }

        .info-card h4 {
            font-size: 13px;
            color: #8892b0;
            margin-bottom: 6px;
            font-weight: 400;
        }

        .info-card p {
            font-size: 16px;
            font-weight: 500;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 18px;
            text-align: center;
        }

        .stat-box .s-value {
            font-size: 24px;
            font-weight: 700;
            color: #A855F7;
        }

        .stat-box .s-label {
            font-size: 12px;
            color: #8892b0;
            margin-top: 4px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            margin-top: 10px;
        }

        .activity-list {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 20px;
        }

        .activity-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 14px;
            color: #ccc;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #FF4FA3;
            flex-shrink: 0;
        }

        .joined-date {
            color: #8892b0;
            font-size: 13px;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .main {
                padding: 70px 20px 20px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .profile-card {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <div class="main">
        <h1 class="page-title">My Profile</h1>

        <!-- Profile Card -->
        <div class="profile-card">
            <div class="profile-avatar-wrap">
                <div class="profile-avatar" id="avatar">?</div>
                <img class="profile-img" id="profileImg" style="display:none;" />
            </div>
            <div class="profile-details">
                <h2 id="profileName">User</h2>
                <p id="profileEmail">email@example.com</p>
                <span class="profile-role role-learner" id="profileRole">Learner</span>
            </div>
            <button class="edit-profile-btn" onclick="openEditModal()">
                <span class="material-icons" style="font-size:16px;">edit</span> Edit Profile
            </button>
        </div>

        <!-- Info -->
        <div class="info-grid">
            <div class="info-card">
                <h4>Full Name</h4>
                <p id="infoName">-</p>
            </div>
            <div class="info-card">
                <h4>Email Address</h4>
                <p id="infoEmail">-</p>
            </div>
            <div class="info-card">
                <h4>Role</h4>
                <p id="infoRole">-</p>
            </div>
            <div class="info-card">
                <h4>Member Since</h4>
                <p id="infoJoined">-</p>
            </div>
        </div>

        <!-- Stats -->
        <h3 class="section-title">Learning Stats</h3>
        <div class="stats-grid">
            <div class="stat-box">
                <div class="s-value" id="pStreak">0</div>
                <div class="s-label">Day Streak</div>
            </div>
            <div class="stat-box">
                <div class="s-value" id="pSessions">0</div>
                <div class="s-label">Sessions</div>
            </div>
            <div class="stat-box">
                <div class="s-value" id="pSkills">0</div>
                <div class="s-label">Skills</div>
            </div>
            <div class="stat-box">
                <div class="s-value" id="pMentors">0</div>
                <div class="s-label">Mentors</div>
            </div>
        </div>

        <!-- Recent Activity -->
        <h3 class="section-title">Recent Activity</h3>
        <div class="activity-list" id="activityList">
            <div class="activity-item">
                <div class="activity-dot"></div> No activity yet. Start learning!
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Edit Profile</h3>
                <button class="modal-close" onclick="closeEditModal()">
                    <span class="material-icons">close</span>
                </button>
            </div>

            <div class="modal-body">
                <!-- Profile Picture Upload -->
                <div class="upload-section">
                    <div class="upload-preview" id="uploadPreview">
                        <span class="material-icons" id="uploadIcon">person</span>
                        <img id="previewImg" style="display:none;" />
                    </div>
                    <div class="upload-info">
                        <p>Profile Picture</p>
                        <label class="upload-btn" for="fileInput">
                            <span class="material-icons" style="font-size:16px;">upload</span> Upload Image
                        </label>
                        <input type="file" id="fileInput" accept="image/*" onchange="handleImageUpload(event)"
                            style="display:none;">
                        <span class="upload-hint">JPG, PNG. Max 2MB.</span>
                    </div>
                </div>

                <!-- Username -->
                <div class="modal-input-group">
                    <label>Username</label>
                    <input type="text" id="editName" placeholder="Enter new username">
                </div>

                <div class="modal-actions">
                    <button class="modal-cancel" onclick="closeEditModal()">Cancel</button>
                    <button class="modal-save" onclick="saveProfile()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <style>
        /* Edit button */
        .edit-profile-btn {
            margin-left: auto;
            padding: 8px 16px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .edit-profile-btn:hover {
            border-color: #FF4FA3;
            background: rgba(255, 79, 163, 0.05);
        }

        /* Avatar wrap */
        .profile-avatar-wrap {
            position: relative;
            flex-shrink: 0;
        }

        .profile-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 500;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: #0d1025;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            width: 420px;
            max-width: 90vw;
            overflow: hidden;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .modal-header h3 {
            font-size: 18px;
        }

        .modal-close {
            background: none;
            border: none;
            cursor: pointer;
        }

        .modal-close .material-icons {
            font-size: 22px;
            color: #888;
            transition: 0.2s;
        }

        .modal-close:hover .material-icons {
            color: #ff4d4d;
        }

        .modal-body {
            padding: 25px;
        }

        /* Upload */
        .upload-section {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 25px;
            padding: 18px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
        }

        .upload-preview {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(168, 85, 247, 0.1);
            border: 2px dashed rgba(168, 85, 247, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
        }

        .upload-preview .material-icons {
            font-size: 28px;
            color: #A855F7;
        }

        .upload-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 50%;
        }

        .upload-info p {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .upload-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 7px 14px;
            background: linear-gradient(45deg, #FF4FA3, #A855F7);
            border-radius: 6px;
            color: white;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .upload-btn:hover {
            transform: scale(1.03);
        }

        .upload-hint {
            display: block;
            font-size: 11px;
            color: #666;
            margin-top: 6px;
        }

        /* Input */
        .modal-input-group {
            margin-bottom: 20px;
        }

        .modal-input-group label {
            display: block;
            font-size: 13px;
            color: #8892b0;
            margin-bottom: 6px;
        }

        .modal-input-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .modal-input-group input:focus {
            border-color: #A855F7;
        }

        /* Actions */
        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .modal-cancel {
            padding: 10px 18px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #888;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .modal-cancel:hover {
            border-color: #ff4d4d;
            color: white;
        }

        .modal-save {
            padding: 10px 22px;
            background: linear-gradient(45deg, #FF4FA3, #A855F7);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .modal-save:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(255, 79, 163, 0.3);
        }
    </style>

    <script>
        // Load user profile from stored data
        function loadProfile() {
            const stored = localStorage.getItem('currentUser');
            let user = { name: 'User', email: 'user@example.com', role: 'learner' };

            if (stored) {
                try { user = JSON.parse(stored); } catch (e) { }
            }

            const name = user.name || 'User';
            const email = user.email || 'user@example.com';
            const role = user.role || 'learner';

            // Avatar
            document.getElementById('avatar').innerText = name.charAt(0).toUpperCase();

            // Show profile pic if saved
            const savedPic = localStorage.getItem('skillnest_profile_pic');
            if (savedPic) {
                const imgEl = document.getElementById('profileImg');
                imgEl.src = savedPic;
                imgEl.style.display = 'block';
                document.getElementById('avatar').style.opacity = '0';
            } else {
                document.getElementById('profileImg').style.display = 'none';
                document.getElementById('avatar').style.opacity = '1';
            }

            // Profile card
            document.getElementById('profileName').innerText = name;
            document.getElementById('profileEmail').innerText = email;

            const roleEl = document.getElementById('profileRole');
            roleEl.innerText = role.charAt(0).toUpperCase() + role.slice(1);
            roleEl.className = 'profile-role role-' + role;

            // Info grid
            document.getElementById('infoName').innerText = name;
            document.getElementById('infoEmail').innerText = email;
            document.getElementById('infoRole').innerText = role.charAt(0).toUpperCase() + role.slice(1);

            // Joined date
            if (user.created_at) {
                document.getElementById('infoJoined').innerText = new Date(user.created_at).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            } else {
                document.getElementById('infoJoined').innerText = new Date().toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            }

            // Stats from user data (per-user key)
            var _pKey = (function () { var s = localStorage.getItem('currentUser'); var e = 'default'; if (s) { try { e = JSON.parse(s).email || 'default'; } catch (x) { } } return 'skillnest_data_' + e; })();
            const userData = JSON.parse(localStorage.getItem(_pKey) || '{}');
            document.getElementById('pStreak').innerText = userData.streak || 0;
            document.getElementById('pSessions').innerText = userData.sessions || 0;
            document.getElementById('pSkills').innerText = (userData.skills || []).length;
            document.getElementById('pMentors').innerText = userData.mentors || 0;

            // Activity
            const activity = userData.activity || [];
            const actList = document.getElementById('activityList');
            if (activity.length > 0) {
                actList.innerHTML = activity.slice(0, 5).map(a =>
                    `<div class="activity-item"><div class="activity-dot"></div>${a.text} <span style="color:#8892b0; margin-left:auto; font-size:12px;">${a.time}</span></div>`
                ).join('');
            }
        }

        loadProfile();

        // ===== EDIT PROFILE =====
        let uploadedImage = null;

        function openEditModal() {
            const stored = localStorage.getItem('currentUser');
            let user = {};
            if (stored) { try { user = JSON.parse(stored); } catch (e) { } }

            document.getElementById('editName').value = user.name || '';

            // Show existing profile pic in preview
            const savedPic = localStorage.getItem('skillnest_profile_pic');
            if (savedPic) {
                document.getElementById('previewImg').src = savedPic;
                document.getElementById('previewImg').style.display = 'block';
                document.getElementById('uploadIcon').style.display = 'none';
            }

            document.getElementById('editModal').classList.add('show');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Check size (2MB max)
            if (file.size > 2 * 1024 * 1024) {
                alert('Image must be under 2MB');
                return;
            }

            // Check type
            if (!file.type.startsWith('image/')) {
                alert('Please upload an image file');
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                uploadedImage = e.target.result;
                document.getElementById('previewImg').src = uploadedImage;
                document.getElementById('previewImg').style.display = 'block';
                document.getElementById('uploadIcon').style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        function saveProfile() {
            const newName = document.getElementById('editName').value.trim();
            const stored = localStorage.getItem('currentUser');
            let user = {};
            if (stored) { try { user = JSON.parse(stored); } catch (e) { } }

            // Update name if changed
            if (newName && newName !== user.name) {
                user.name = newName;
                localStorage.setItem('currentUser', JSON.stringify(user));
            }

            // Save profile picture
            if (uploadedImage) {
                localStorage.setItem('skillnest_profile_pic', uploadedImage);
            }

            closeEditModal();
            loadProfile(); // Refresh display
        }
    </script>

    <!-- Shared Sidebar -->
    <script src="public/Assets/js/sidebar.js"></script>
</body>

</html>
