<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Reviewer - SkillNest</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #050816;
            color: white;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 30px 40px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .page-header h1 .material-icons {
            color: #FF4FA3;
            font-size: 30px;
        }

        .page-header p {
            color: #8892b0;
            font-size: 14px;
        }

        /* Upload area */
        .upload-area {
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed rgba(168, 85, 247, 0.3);
            border-radius: 16px;
            padding: 50px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: #FF4FA3;
            background: rgba(255, 79, 163, 0.03);
        }

        .upload-area.dragover {
            border-color: #FF4FA3;
            background: rgba(255, 79, 163, 0.05);
        }

        .upload-area .material-icons {
            font-size: 48px;
            color: #A855F7;
            margin-bottom: 15px;
        }

        .upload-area h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .upload-area p {
            color: #8892b0;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .upload-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 22px;
            background: linear-gradient(45deg, #FF4FA3, #A855F7);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 79, 163, 0.3);
        }

        .file-info {
            margin-top: 12px;
            font-size: 13px;
            color: #34c759;
            display: none;
        }

        /* Loading */
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #FF4FA3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading p {
            color: #8892b0;
            font-size: 14px;
        }

        /* Results */
        .results {
            display: none;
        }

        .score-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            margin-bottom: 25px;
        }

        .score-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 28px;
            font-weight: bold;
        }

        .score-good {
            border: 4px solid #34c759;
            color: #34c759;
        }

        .score-ok {
            border: 4px solid #f5a623;
            color: #f5a623;
        }

        .score-poor {
            border: 4px solid #ff4d4d;
            color: #ff4d4d;
        }

        .score-card h3 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .score-card p {
            color: #8892b0;
            font-size: 14px;
        }

        .feedback-section {
            margin-bottom: 20px;
        }

        .feedback-section h3 {
            font-size: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feedback-section h3 .material-icons {
            font-size: 20px;
        }

        .feedback-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 10px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .feedback-item .fi-icon {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .fi-icon.good {
            background: rgba(52, 199, 89, 0.15);
            color: #34c759;
        }

        .fi-icon.warning {
            background: rgba(245, 166, 35, 0.15);
            color: #f5a623;
        }

        .fi-icon.error {
            background: rgba(255, 77, 77, 0.15);
            color: #ff4d4d;
        }

        .feedback-item p {
            font-size: 14px;
            color: #ccc;
            line-height: 1.5;
        }

        .feedback-item .fi-label {
            font-weight: 600;
            color: white;
            margin-bottom: 2px;
        }

        .retry-btn {
            display: block;
            margin: 30px auto 0;
            padding: 12px 28px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .retry-btn:hover {
            border-color: #FF4FA3;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="page-header">
            <h1><span class="material-icons">description</span> AI Resume Reviewer</h1>
            <p>Upload your resume and get instant, actionable feedback powered by AI</p>
        </div>

        <!-- Upload -->
        <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
            <span class="material-icons">cloud_upload</span>
            <h3>Drop your resume here</h3>
            <p>or click to browse (PDF, DOC, DOCX — max 5MB)</p>
            <button class="upload-btn"><span class="material-icons" style="font-size:18px;">upload_file</span> Choose
                File</button>
            <div class="file-info" id="fileInfo"></div>
        </div>
        <input type="file" id="fileInput" accept=".pdf,.doc,.docx" style="display:none;" onchange="handleFile(event)">

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>AI is analyzing your resume...</p>
        </div>

        <!-- Results -->
        <div class="results" id="results"></div>
    </div>

    <script>
        var uploadArea = document.getElementById('uploadArea');

        // Drag and drop
        uploadArea.addEventListener('dragover', function (e) { e.preventDefault(); uploadArea.classList.add('dragover'); });
        uploadArea.addEventListener('dragleave', function () { uploadArea.classList.remove('dragover'); });
        uploadArea.addEventListener('drop', function (e) { e.preventDefault(); uploadArea.classList.remove('dragover'); if (e.dataTransfer.files.length) processFile(e.dataTransfer.files[0]); });

        function handleFile(e) { if (e.target.files.length) processFile(e.target.files[0]); }

        function processFile(file) {
            // Validate
            var validTypes = ['application/pdf', 'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
            if (!validTypes.includes(file.type) && !file.name.match(/\.(pdf|doc|docx)$/i)) {
                alert('Please upload a PDF or DOC file'); return;
            }
            if (file.size > 5 * 1024 * 1024) { alert('File must be under 5MB'); return; }

            // Show file info
            document.getElementById('fileInfo').style.display = 'block';
            document.getElementById('fileInfo').innerText = file.name + ' (' + (file.size / 1024).toFixed(0) + ' KB)';

            // Read file content
            var reader = new FileReader();
            reader.onload = function (e) {
                var content = e.target.result;
                // For PDF, extract text (basic approach)
                var text = extractText(content, file.name);
                analyzeResume(text, file.name);
            };
            reader.readAsText(file);
        }

        function extractText(content, filename) {
            // For text-based content, return as-is
            // For binary PDF, we'll work with what we can extract
            // Remove binary garbage, keep readable text
            var cleaned = content.replace(/[^\x20-\x7E\n\r]/g, ' ').replace(/\s+/g, ' ').trim();
            return cleaned;
        }

        function analyzeResume(text, filename) {
            document.getElementById('uploadArea').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            // Simulate analysis time (real analysis happens synchronously)
            setTimeout(function () {
                document.getElementById('loading').style.display = 'none';
                var feedback = performAnalysis(text, filename);
                displayResults(feedback);
            }, 2500);
        }

        function performAnalysis(text, filename) {
            var t = text.toLowerCase();
            var feedback = { score: 0, strengths: [], improvements: [], critical: [] };
            var points = 0;
            var maxPoints = 100;

            // === CONTACT INFO ===
            var hasEmail = t.includes('@') && (t.includes('.com') || t.includes('.in') || t.includes('.org') || t.includes('.edu'));
            var hasPhone = /\d{10}|\d{3}[-.\s]\d{3}[-.\s]\d{4}|\+\d/.test(t);
            var hasLinkedin = t.includes('linkedin');
            var hasGithub = t.includes('github');

            if (hasEmail) { points += 8; feedback.strengths.push('Email address is present'); }
            else { feedback.critical.push('No email address found. Add your professional email.'); }

            if (hasPhone) { points += 5; }
            else { feedback.improvements.push('Consider adding a phone number for easier contact.'); }

            if (hasLinkedin) { points += 5; feedback.strengths.push('LinkedIn profile included'); }
            else { feedback.improvements.push('Add your LinkedIn profile URL to build credibility.'); }

            if (hasGithub) { points += 5; feedback.strengths.push('GitHub profile linked'); }
            else { feedback.improvements.push('Add your GitHub link to showcase your code and projects.'); }

            // === EDUCATION ===
            var hasEducation = t.includes('education') || t.includes('university') || t.includes('college') || t.includes('degree') || t.includes('bachelor') || t.includes('master') || t.includes('b.tech') || t.includes('b.e') || t.includes('bca') || t.includes('mca');
            if (hasEducation) { points += 10; feedback.strengths.push('Education section detected'); }
            else { feedback.critical.push('Missing Education section. Add your degree, institution, and graduation year.'); }

            // === EXPERIENCE / INTERNSHIP ===
            var hasExperience = t.includes('experience') || t.includes('internship') || t.includes('work history') || t.includes('employment');
            if (hasExperience) { points += 12; feedback.strengths.push('Work experience/internship section found'); }
            else { feedback.improvements.push('Add an Experience or Internship section, even if it is brief.'); }

            // === PROJECTS ===
            var hasProjects = t.includes('project') || t.includes('projects');
            if (hasProjects) { points += 12; feedback.strengths.push('Projects section included'); }
            else { feedback.critical.push('Missing Projects section. Add 2-3 projects with tech stack, description, and links.'); }

            // === SKILLS ===
            var hasSkills = t.includes('skill') || t.includes('technologies') || t.includes('tech stack') || t.includes('proficient');
            if (hasSkills) { points += 10; feedback.strengths.push('Skills/Technologies section present'); }
            else { feedback.critical.push('No Skills section found. List your technical and soft skills clearly.'); }

            // === MEASURABLE IMPACT ===
            var hasNumbers = /\d+%|\d+\s*(users|customers|revenue|increase|decrease|reduced|improved|served|built|deployed)/.test(t);
            if (hasNumbers) { points += 10; feedback.strengths.push('Uses quantifiable metrics and measurable impact'); }
            else { feedback.improvements.push('Add measurable impact to your achievements (e.g., "Reduced load time by 40%", "Served 500+ users").'); }

            // === ACTION VERBS ===
            var actionVerbs = ['developed', 'built', 'designed', 'implemented', 'created', 'managed', 'led', 'optimized', 'deployed', 'integrated', 'automated'];
            var hasActionVerbs = actionVerbs.some(function (v) { return t.includes(v); });
            if (hasActionVerbs) { points += 8; feedback.strengths.push('Uses strong action verbs'); }
            else { feedback.improvements.push('Use strong action verbs (Developed, Built, Designed, Implemented, Deployed) to describe your work.'); }

            // === CERTIFICATIONS ===
            var hasCerts = t.includes('certif') || t.includes('course') || t.includes('certification') || t.includes('certified');
            if (hasCerts) { points += 5; feedback.strengths.push('Certifications/Courses mentioned'); }
            else { feedback.improvements.push('Add relevant certifications or online courses to stand out.'); }

            // === ACHIEVEMENTS ===
            var hasAchievements = t.includes('achievement') || t.includes('award') || t.includes('hackathon') || t.includes('competition') || t.includes('winner') || t.includes('rank');
            if (hasAchievements) { points += 7; feedback.strengths.push('Achievements/Awards section found'); }
            else { feedback.improvements.push('Add an Achievements section (hackathons, competitions, awards, rankings).'); }

            // === LENGTH CHECK ===
            var wordCount = t.split(/\s+/).length;
            if (wordCount > 150 && wordCount < 800) { points += 8; feedback.strengths.push('Resume length looks appropriate'); }
            else if (wordCount < 100) { feedback.critical.push('Resume appears too short. A good resume is typically 1-2 pages with detailed content.'); }
            else if (wordCount > 1000) { feedback.improvements.push('Resume may be too long. Try to keep it concise — 1-2 pages max.'); }

            // === FORMATTING KEYWORDS ===
            var hasSummary = t.includes('summary') || t.includes('objective') || t.includes('about me') || t.includes('profile');
            if (hasSummary) { points += 5; feedback.strengths.push('Has a professional summary/objective'); }
            else { feedback.improvements.push('Add a brief Professional Summary at the top (2-3 lines about your goals and strengths).'); }

            feedback.score = Math.min(points, maxPoints);
            return feedback;
        }

        function displayResults(feedback) {
            var scoreClass = feedback.score >= 70 ? 'score-good' : (feedback.score >= 40 ? 'score-ok' : 'score-poor');
            var scoreLabel = feedback.score >= 70 ? 'Strong Resume' : (feedback.score >= 40 ? 'Needs Improvement' : 'Major Issues Found');

            var html = '<div class="score-card"><div class="score-circle ' + scoreClass + '">' + feedback.score + '</div><h3>' + scoreLabel + '</h3><p>Score out of 100 based on content analysis</p></div>';

            // Critical issues
            if (feedback.critical.length > 0) {
                html += '<div class="feedback-section"><h3><span class="material-icons" style="color:#ff4d4d;">error</span> Critical Issues</h3>';
                feedback.critical.forEach(function (item) {
                    html += '<div class="feedback-item"><div class="fi-icon error">!</div><p>' + item + '</p></div>';
                });
                html += '</div>';
            }

            // Improvements
            if (feedback.improvements.length > 0) {
                html += '<div class="feedback-section"><h3><span class="material-icons" style="color:#f5a623;">warning</span> Suggestions</h3>';
                feedback.improvements.forEach(function (item) {
                    html += '<div class="feedback-item"><div class="fi-icon warning">~</div><p>' + item + '</p></div>';
                });
                html += '</div>';
            }

            // Strengths
            if (feedback.strengths.length > 0) {
                html += '<div class="feedback-section"><h3><span class="material-icons" style="color:#34c759;">check_circle</span> Strengths</h3>';
                feedback.strengths.forEach(function (item) {
                    html += '<div class="feedback-item"><div class="fi-icon good">&#10003;</div><p>' + item + '</p></div>';
                });
                html += '</div>';
            }

            html += '<button class="retry-btn" onclick="location.reload()"><span class="material-icons" style="font-size:16px;vertical-align:middle;">refresh</span> Review Another Resume</button>';

            document.getElementById('results').innerHTML = html;
            document.getElementById('results').style.display = 'block';

            // Track activity
            var d = JSON.parse(localStorage.getItem('skillnest_user_data') || '{}');
            d.activity = d.activity || [];
            d.activity.unshift({ text: 'Reviewed resume with AI (Score: ' + feedback.score + '/100)', time: 'Just now' });
            localStorage.setItem('skillnest_user_data', JSON.stringify(d));
        }
    </script>
    <script src="public/Assets/js/sidebar.js"></script>
</body>

</html>
