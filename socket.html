<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillNest</title>
    <link rel="stylesheet" href="public/Assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="public/Assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ✅ FIX 1: socket.io FIRST -->
    <script src="http://localhost:3000/socket.io/socket.io.js"></script>
    <!-- ✅ FIX 2: jQuery SECOND (must come before app.js) -->
    <script src="public/Assets/js/jquery-3.4.1.min.js"></script>
    <!-- ✅ FIX 3: app.js LAST (depends on jQuery) -->
    <script src="https://unpkg.com/simple-peer@latest/simplepeer.min.js"></script>
    <script src="public/Assets/js/app.js"></script>
</head>

<body>
    <main id="meetingContainer" class="d-flex flex-column home-wrap">

        <div class="g-top text-light" style="justify-content: space-between; padding: 10px 20px;">
            <h3 style="color:#ff4fa3; margin:0;">SkillNest</h3>
            <div>
                <span class="material-icons ms-3">people</span>
                <span class="material-icons ms-3">chat</span>
            </div>
        </div>

        <div class="top-remote-video-show-wrap d-flex">
            <div class="call-wrap" style="background-color:black;">
                <div class="video-wrap" id="divUsers">
                    <h2 id="myName" class="display-center" style="font-size: 14px;"></h2>
                    <div class="display-center">
                        <video autoplay muted id="localVideoPlayer"></video>
                    </div>
                </div>
                <div id="otherTemplate" class="userbox display-center flex-column" style="display:none">
                    <h2 class="display-center username"></h2>
                    <div class="display-center video-container">
                        <video autoplay muted></video>
                        <audio autoplay controls style="display:none"></audio>
                    </div>
                </div>
            </div>
        </div>
        </div>

        <div class="g-top-left bg-light text-secondary w-25 d-none
    d-flex align-items-center justify-content-between pl-2 pr-2">
            <div class="top-left-participant-wrap pt-2 cursor-pointer">
                <div class="top-left-participant-icon">
                    <span class="material-icons">people</span>
                </div>
                <div class="top-left-participant-count"></div>
            </div>
            <div class="top-left-chat-wrap pt-2 cursor-pointer">
                <span class="material-icons">message</span>
            </div>
            <div class="top-left-time-wrap"></div>
        </div>

        <div class="g-bottom bg-light m-0 d-flex justify-content-between align-items-center">
            <div class="bottom-left d-flex" style="height:10vh">
                <div class="display-center cursor-pointer meeting-details-button">
                    Session Info: <span class="material-icons">keyboard_arrow_down</span>
                    Code: <span id="meetingCode"></span>
                    <br>
                    <button onclick="copyLink()"
                        style="margin-top:5px; padding:5px 10px; border:none; border-radius:8px; cursor:pointer;">
                        Copy Invite Link
                    </button>
                </div>
            </div>
            <div class="bottom-middle d-flex justify-content-center align-items-center" style="height: 10vh;">
                <div class="mic-toggle-wrap action-icon-style display-center mr-2 cursor-pointer" id="micMuteUnmute">
                    <span class="material-icons" id="micIcon">mic</span>
                </div>
                <div class="end-call-wrap action-icon-style display-center mr-2 cursor-pointer" id="endCallBtn">
                    <span class="material-icons text-danger">call</span>
                </div>
                <div class="video-toggle-wrap action-icon-style display-center cursor-pointer" id="videoCamOnOff">
                    <span class="material-icons" id="cameraIcon">videocam</span>
                </div>
            </div>
            <div class="bottom-right d-flex just-content-center align-items-center mr-3">
                <div class="present-now-wrap d-flex just-content-center flex-column
                align-items-center mr-5 cursor-pointer" id="btnScreenShareOnOff">
                    <span class="material-icons">present_to_all</span>
                    <div>Present Now</div>
                </div>
                <div class="option-wrap cursor-pointer display-center" style="height:auto 10vh; position:relative;">
                    <div class="option-icon">
                        <span class="material-icons">more_vert</span>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script>
        const params = new URLSearchParams(window.location.search);

        const meetId = params.get("meet");
        const userName = params.get("user");


        if (meetId) {
            document.getElementById("meetingCode").innerText = meetId;
        }


        if (userName) {
            const nameEl = document.getElementById("myName");
            if (nameEl) {
                nameEl.innerText = userName + " (You)";
            }
        }

        if (userName) {
            setTimeout(() => {
                const msg = document.createElement("div");
                msg.innerText = userName + " joined the meeting";

                msg.style.position = "absolute";
                msg.style.top = "20px";
                msg.style.right = "20px";
                msg.style.background = "#1c1c2e";
                msg.style.color = "white";
                msg.style.padding = "10px 15px";
                msg.style.borderRadius = "10px";
                msg.style.boxShadow = "0 0 10px rgba(0,0,0,0.3)";

                document.body.appendChild(msg);

                setTimeout(() => msg.remove(), 3000);
            }, 1000);
        }


        function copyLink() {
            const link = window.location.href;
            navigator.clipboard.writeText(link);
            alert("Invite link copied!");
        }
    </script>
<script>
    window.onload = function () {
        const params = new URLSearchParams(window.location.search);

        const meetId = params.get("meet");
        const userName = params.get("user");

        console.log("INIT RUNNING", userName, meetId);

        if (!userName || !meetId) {
            alert("Missing user or meeting ID");
            window.location.href = "action.html";
            return;
        }

        // 🔥 START YOUR APP
        AppProcess.innit(userName, meetId);
    };
</script>


</body>

</html>
