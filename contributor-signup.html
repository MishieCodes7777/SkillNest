<!DOCTYPE html>
<html>

<head>
    <title>Contributor Signup - SkillNest</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #0f0f1a, #1a1a2e);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 35px;
            border-radius: 12px;
            width: 350px;
            box-shadow:
                0 0 20px rgba(236, 72, 153, 0.4),
                0 0 40px rgba(168, 85, 247, 0.3);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            outline: none;
            background: #0f0f1a;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
            transition: 0.2s;
        }

        input:focus {
            border-color: #8b5cf6;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: linear-gradient(45deg, #6c63ff, #8a7dff);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 15px;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(108, 99, 255, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        a {
            color: #8a7dff;
            text-decoration: none;
        }

        p {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            padding: 8px;
            background: rgba(255, 77, 77, 0.1);
            border-radius: 6px;
        }

        .success-msg {
            color: #34c759;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            padding: 8px;
            background: rgba(52, 199, 89, 0.1);
            border-radius: 6px;
        }

        .password-hint {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>Become a Mentor</h2>

        <div class="input-group">
            <label>Full Name</label>
            <input id="name" placeholder="Enter your name">
        </div>

        <div class="input-group">
            <label>Email</label>
            <input id="email" type="email" placeholder="Enter your email">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input id="password" type="password" placeholder="Create a password">
            <div class="password-hint">Min 6 characters, must include a number</div>
        </div>

        <button id="signupBtn" onclick="signup()">Sign Up as Mentor</button>

        <div id="message"></div>

        <p>Already have an account? <a href="index.html">Log in</a></p>
    </div>

    <script>
        async function signup() {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!name || !email || !password) { showMessage('Please fill in all fields.', 'error'); return; }
            if (name.length < 2) { showMessage('Name must be at least 2 characters.', 'error'); return; }
            if (!email.includes('@') || !email.includes('.')) { showMessage('Please enter a valid email.', 'error'); return; }
            if (password.length < 6) { showMessage('Password must be at least 6 characters.', 'error'); return; }
            if (!/\d/.test(password)) { showMessage('Password must contain at least one number.', 'error'); return; }

            const btn = document.getElementById('signupBtn');
            btn.textContent = 'Creating account...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, role: 'mentor' }),
                });

                const data = await res.json();

                if (data.success) {
                    showMessage('Account created! Redirecting...', 'success');
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    setTimeout(() => { window.location.href = 'dashboard.html?user=' + data.user.name; }, 1000);
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (err) {
                showMessage('Network error. Please try again.', 'error');
            }

            btn.textContent = 'Sign Up as Mentor';
            btn.disabled = false;
        }

        function showMessage(msg, type) {
            const el = document.getElementById('message');
            el.className = type === 'error' ? 'error-msg' : 'success-msg';
            el.textContent = msg;
            if (type === 'error') setTimeout(() => { el.textContent = ''; el.className = ''; }, 4000);
        }

        document.addEventListener('keypress', function (e) { if (e.key === 'Enter') signup(); });
    </script>
</body>

</html>
