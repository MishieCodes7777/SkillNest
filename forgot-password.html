<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SkillNest</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f0f1a, #1a1a2e);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 35px;
            border-radius: 12px;
            width: 360px;
            box-shadow:
                0 0 20px rgba(236, 72, 153, 0.4),
                0 0 40px rgba(168, 85, 247, 0.3);
        }

        h2 {
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .method-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .method-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid #444;
            background: transparent;
            color: #aaa;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
        }

        .method-btn.active {
            background: linear-gradient(45deg, #6c63ff, #8a7dff);
            color: white;
            border: none;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 6px;
            outline: none;
            background: #0f0f1a;
            color: white;
            font-size: 14px;
        }

        .otp-input {
            text-align: center;
            font-size: 22px;
            letter-spacing: 8px;
            font-weight: bold;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: linear-gradient(45deg, #ec4899, #8b5cf6);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 15px;
        }

        .submit-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.5);
        }

        .info-text {
            color: #ccc;
            font-size: 13px;
            text-align: center;
            margin-bottom: 5px;
        }

        .message {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            color: #34c759;
        }

        .resend-text {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            color: #aaa;
        }

        .resend-link {
            color: #8a7dff;
            cursor: pointer;
        }

        .resend-link:hover {
            text-decoration: underline;
        }

        .back-link {
            text-align: center;
            margin-top: 15px;
        }

        .back-link a {
            color: #8a7dff;
            text-decoration: none;
            font-size: 13px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>Forgot Password</h2>
        <p class="subtitle" id="roleText">Account Recovery</p>

        <!-- Step 1: Choose method -->
        <div id="step1">
            <div class="method-toggle">
                <button class="method-btn active" id="emailBtn" onclick="setMethod('email')">Email</button>
                <button class="method-btn" id="phoneBtn" onclick="setMethod('phone')">Phone</button>
            </div>

            <input type="text" id="contactInput" placeholder="Enter your email">
            <button class="submit-btn" onclick="sendOtp()">Send OTP</button>
        </div>

        <!-- Step 2: Enter OTP -->
        <div id="step2" class="hidden">
            <p class="info-text">Enter the 6-digit OTP sent to your <span id="methodLabel">email</span></p>
            <input type="text" id="otpInput" placeholder="Enter OTP" maxlength="6" class="otp-input">
            <button class="submit-btn" onclick="verifyOtp()">Verify OTP</button>

            <p class="resend-text">
                Didn't receive? <span class="resend-link" onclick="resendOtp()">Resend OTP</span>
            </p>
        </div>

        <!-- Step 3: New password -->
        <div id="step3" class="hidden">
            <input type="password" id="newPassword" placeholder="New Password">
            <input type="password" id="confirmPassword" placeholder="Confirm New Password">
            <button class="submit-btn" onclick="resetPassword()">Reset Password</button>
        </div>

        <!-- Message -->
        <p class="message" id="message"></p>

        <!-- Back link -->
        <p class="back-link">
            <a href="#" id="backLink" onclick="goBack()">← Back to Login</a>
        </p>
    </div>

    <script>
        let method = 'email';
        let generatedOtp = '';
        let contact = '';

        const params = new URLSearchParams(window.location.search);
        const role = params.get('role') || 'user';

        // Set role text
        document.getElementById('roleText').innerText =
            (role === 'contributor' ? 'Contributor' : 'User') + ' Account Recovery';

        function setMethod(m) {
            method = m;
            document.getElementById('emailBtn').classList.toggle('active', m === 'email');
            document.getElementById('phoneBtn').classList.toggle('active', m === 'phone');
            document.getElementById('contactInput').placeholder =
                m === 'email' ? 'Enter your email' : 'Enter your phone number';
        }

        function sendOtp() {
            contact = document.getElementById('contactInput').value.trim();
            if (!contact) {
                showMessage('Please enter your ' + method, 'red');
                return;
            }

            // Check if user exists in localStorage
            const users = JSON.parse(localStorage.getItem('users')) || [];
            let userExists = false;

            if (method === 'email') {
                userExists = users.some(u => u.email === contact && u.role === role);
            } else {
                userExists = users.some(u => u.phone === contact && u.role === role);
            }

            if (!userExists) {
                showMessage('No account found with this ' + method, 'red');
                return;
            }

            // Generate OTP
            generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();

            // In real app, send via email/SMS. For demo, show alert.
            alert('Your OTP is: ' + generatedOtp + '\n\n(In production, this would be sent to your ' + method + ')');

            showMessage('OTP sent to your ' + method + '!', '#34c759');
            document.getElementById('methodLabel').innerText = method;

            // Switch to step 2
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }

        function verifyOtp() {
            const otp = document.getElementById('otpInput').value.trim();
            if (!otp) {
                showMessage('Please enter the OTP', 'red');
                return;
            }

            if (otp === generatedOtp) {
                showMessage('OTP verified! Set your new password.', '#34c759');
                document.getElementById('step2').classList.add('hidden');
                document.getElementById('step3').classList.remove('hidden');
            } else {
                showMessage('Invalid OTP. Please try again.', 'red');
            }
        }

        function resendOtp() {
            generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();
            alert('Your new OTP is: ' + generatedOtp);
            showMessage('New OTP sent!', '#34c759');
        }

        function resetPassword() {
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;

            if (!newPass) {
                showMessage('Please enter a new password', 'red');
                return;
            }

            if (newPass !== confirmPass) {
                showMessage('Passwords do not match', 'red');
                return;
            }

            // Update in localStorage
            const users = JSON.parse(localStorage.getItem('users')) || [];
            const updated = users.map(u => {
                if (method === 'email' && u.email === contact && u.role === role) {
                    return { ...u, password: newPass };
                }
                if (method === 'phone' && u.phone === contact && u.role === role) {
                    return { ...u, password: newPass };
                }
                return u;
            });

            localStorage.setItem('users', JSON.stringify(updated));

            alert('Password reset successful!');
            goBack();
        }

        function goBack() {
            window.location.href = role === 'contributor' ? 'contributor-login.html' : 'user-login.html';
        }

        function showMessage(text, color) {
            const el = document.getElementById('message');
            el.innerText = text;
            el.style.color = color || '#34c759';
        }
    </script>
</body>

</html>
