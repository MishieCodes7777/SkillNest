<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SkillNest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .split-container {
            display: flex;
            height: 100vh;
        }

        /* Left */
        .left-side {
            flex: 1;
            background: #0a0a14;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 50px;
        }

        .form-wrapper {
            width: 100%;
            max-width: 380px;
        }

        .brand {
            font-size: 26px;
            color: #ff4fa3;
            font-weight: bold;
            margin-bottom: 35px;
            letter-spacing: 0.5px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            color: #aaa;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: #1c1c2e;
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: #8b5cf6;
        }

        .input-group select {
            appearance: none;
            cursor: pointer;
        }

        .password-hint {
            font-size: 11px;
            color: #555;
            margin-top: 4px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #ec4899, #8b5cf6);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            margin-bottom: 18px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            color: #555;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            padding: 0 15px;
        }

        .google-btn {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            background: transparent;
            color: white;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
            margin-bottom: 18px;
        }

        .google-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .google-btn img {
            width: 20px;
            height: 20px;
        }

        .bottom-text {
            text-align: center;
            color: #888;
            font-size: 14px;
        }

        .bottom-text a {
            color: #8b5cf6;
            text-decoration: none;
            font-weight: 600;
        }

        .bottom-text a:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 13px;
            text-align: center;
            padding: 8px;
            background: rgba(255, 77, 77, 0.1);
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .success-msg {
            color: #34c759;
            font-size: 13px;
            text-align: center;
            padding: 8px;
            background: rgba(52, 199, 89, 0.1);
            border-radius: 6px;
            margin-bottom: 10px;
        }

        /* Right */
        .right-side {
            flex: 1;
            position: relative;
            background: #0a0a14;
            overflow: hidden;
        }

        #three-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .right-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
            pointer-events: none;
        }

        .right-overlay h1 {
            font-size: 56px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff4fa3, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .right-overlay p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 15px;
            text-align: center;
            max-width: 280px;
            line-height: 1.5;
            margin-top: 12px;
        }

        @media(max-width:768px) {
            .split-container {
                flex-direction: column;
            }

            .right-side {
                display: none;
            }

            .left-side {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="split-container">
        <!-- Left: Signup Form -->
        <div class="left-side">
            <div class="form-wrapper">
                <div class="brand">Create your account</div>

                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name">
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter your email">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Create a password">
                    <div class="password-hint">Min 6 characters, must include a number</div>
                </div>
                <div class="input-group">
                    <label>I want to</label>
                    <select id="role">
                        <option value="learner">Learn Skills</option>
                        <option value="mentor">Teach Skills</option>
                    </select>
                </div>

                <button class="submit-btn" id="signupBtn" onclick="signup()">Sign Up</button>

                <div class="divider"><span>or</span></div>

                <button class="google-btn" onclick="alert('Google Sign-In coming soon')">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                    Continue with Google
                </button>

                <div id="message"></div>

                <p class="bottom-text">Already have an account? <a href="index.html">Log in</a></p>
            </div>
        </div>

        <!-- Right: Three.js + Branding -->
        <div class="right-side">
            <canvas id="three-canvas"></canvas>
            <div class="right-overlay">
                <h1>SkillNest</h1>
                <p>Learn skills together with real mentors, in real-time, for free.</p>
            </div>
        </div>
    </div>

    <!-- THREE.JS -->
    <script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
    <script type="module">
        import * as THREE from 'three';
        const canvas = document.getElementById('three-canvas');
        const parent = canvas.parentElement;
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, parent.clientWidth / parent.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setSize(parent.clientWidth, parent.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        const pc = 1500, pos = new Float32Array(pc * 3), col = new Float32Array(pc * 3);
        for (let i = 0; i < pc; i++) { pos[i * 3] = (Math.random() - 0.5) * 20; pos[i * 3 + 1] = (Math.random() - 0.5) * 20; pos[i * 3 + 2] = (Math.random() - 0.5) * 20; const t = Math.random(); col[i * 3] = 0.9 + t * 0.1; col[i * 3 + 1] = 0.2 + t * 0.3; col[i * 3 + 2] = 0.5 + t * 0.5; }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
        const mat = new THREE.PointsMaterial({ size: 0.03, vertexColors: true, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending });
        const particles = new THREE.Points(geo, mat); scene.add(particles);
        const shapes = []; const sMat = new THREE.MeshBasicMaterial({ color: 0x8b5cf6, wireframe: true, transparent: true, opacity: 0.15 });
        for (let i = 0; i < 5; i++) { const gs = [new THREE.IcosahedronGeometry(0.5, 0), new THREE.OctahedronGeometry(0.4, 0), new THREE.TetrahedronGeometry(0.4, 0)]; const g = gs[Math.floor(Math.random() * gs.length)]; const m = new THREE.Mesh(g, sMat.clone()); m.position.set((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 8, (Math.random() - 0.5) * 6 - 3); m.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0); m.userData = { rx: 0.002 + Math.random() * 0.005, ry: 0.002 + Math.random() * 0.005, fs: 0.3 + Math.random() * 0.5, fo: Math.random() * Math.PI * 2 }; scene.add(m); shapes.push(m); }
        camera.position.z = 5; let mx = 0, my = 0;
        document.addEventListener('mousemove', e => { mx = (e.clientX / window.innerWidth - 0.5) * 2; my = (e.clientY / window.innerHeight - 0.5) * 2; });
        function animate() { requestAnimationFrame(animate); const t = Date.now() * 0.001; particles.rotation.y += 0.0003; particles.rotation.x += 0.0001; particles.rotation.y += mx * 0.0005; particles.rotation.x += my * 0.0003; shapes.forEach(s => { s.rotation.x += s.userData.rx; s.rotation.y += s.userData.ry; s.position.y += Math.sin(t * s.userData.fs + s.userData.fo) * 0.003; }); renderer.render(scene, camera); }
        animate();
        const ro = new ResizeObserver(() => { const w = parent.clientWidth, h = parent.clientHeight; if (w > 0 && h > 0) { camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h); } });
        ro.observe(parent);
    </script>

    <!-- App Logic -->
    <script>
        async function signup() {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            if (!name || !email || !password) { showMsg('Please fill in all fields.', 'error'); return; }
            if (name.length < 2) { showMsg('Name must be at least 2 characters.', 'error'); return; }
            if (!email.includes('@') || !email.includes('.')) { showMsg('Please enter a valid email.', 'error'); return; }
            if (password.length < 6) { showMsg('Password must be at least 6 characters.', 'error'); return; }
            if (!/\d/.test(password)) { showMsg('Password must contain at least one number.', 'error'); return; }

            const btn = document.getElementById('signupBtn');
            btn.textContent = 'Creating account...'; btn.disabled = true;

            try {
                const res = await fetch('/api/auth/signup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, email, password, role }) });
                const data = await res.json();
                if (data.success) {
                    showMsg('Account created! Redirecting...', 'success');
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    setTimeout(() => { window.location.href = 'dashboard.html?user=' + data.user.name; }, 1000);
                } else {
                    showMsg(data.message, 'error');
                }
            } catch (err) { showMsg('Unable to connect to server.', 'error'); }
            btn.textContent = 'Sign Up'; btn.disabled = false;
        }

        function showMsg(msg, type) {
            const el = document.getElementById('message');
            el.className = type === 'error' ? 'error-msg' : 'success-msg';
            el.textContent = msg;
            if (type === 'error') setTimeout(() => { el.textContent = ''; el.className = ''; }, 4000);
        }

        document.addEventListener('keypress', function (e) { if (e.key === 'Enter') signup(); });
    </script>
</body>

</html>
